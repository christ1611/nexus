spring:
  application:
    name: wa-webhook
  config:
    # Load KEY=VALUE files from the working directory. Real environment variables still win.
    import:
      - "optional:file:./wa.env[.properties]"
      - "optional:file:./.env[.properties]"
      - "classpath:demo-data.yml"
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: webhook-
      shutdown:
        # Let in-flight webhook processing finish before the JVM exits.
        await-termination: true
        await-termination-period: 20s
  http:
    client:
      connect-timeout: 5s
      read-timeout: 15s

  datasource:
    # Embedded H2 database stored under ./data (ignored by git).
    url: jdbc:h2:file:./data/wa-webhook
    username: sa
    password: ""
  sql:
    init:
      mode: always

server:
  # The hosting platform injects PORT; 8080 stays the local default.
  port: ${PORT:8080}

app:
  # Base URL dealers open one-time links on (the axhub deployment; override locally with APP_PUBLIC_BASE_URL).
  public-base-url: ${APP_PUBLIC_BASE_URL:https://nexus.jbax.axhub.ai}
  link-ttl: 24h
  # Where downloaded customer documents are stored (one folder per application).
  documents-dir: ./data/documents
  # Decision evidence reports (PDF), generated on every approve / reject for regulators and audits.
  reports-dir: ./data/reports
  time-zone: Asia/Jakarta
  # Required for the /admin/** endpoints (sent as X-Admin-Key header).
  admin-api-key: ${ADMIN_API_KEY:}
  # stub = demo document check (default); claude = Claude vision analysis + review agent (needs ANTHROPIC_API_KEY).
  document-check: ${DOCUMENT_CHECK:stub}

# Claude API (used only when app.document-check=claude).
claude:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5-5}
  effort: high
  timeout: 120s
  max-retries: 2
  # Fields read below this confidence are marked "needs officer review" and never used automatically.
  min-field-confidence: 0.85
  # How often the review agent may send the customer back for documents before it must write the summary.
  max-review-rounds: 2

# Demo dealers are upserted at startup by dealer code; entries with a blank phone are skipped.
# country: ID / MM / KH (market and verification providers); tier: STANDARD / EXCELLENT (customer badge).
demo:
  # Fake applications for the dashboard / review demo (DEMO_SEED_APPLICATIONS=true), or POST /admin/demo/seed at runtime.
  seed-applications: ${DEMO_SEED_APPLICATIONS:false}
  seed-count: ${DEMO_SEED_COUNT:40}
  dealers:
    - code: DLR-001
      name: ${DEMO_DEALER_1_NAME:Demo Dealer One}
      phone: ${DEMO_DEALER_1_PHONE:}
      country: ${DEMO_DEALER_1_COUNTRY:ID}
      tier: ${DEMO_DEALER_1_TIER:EXCELLENT}
    - code: DLR-002
      name: ${DEMO_DEALER_2_NAME:Demo Dealer Two}
      phone: ${DEMO_DEALER_2_PHONE:}
      country: ${DEMO_DEALER_2_COUNTRY:ID}
      tier: ${DEMO_DEALER_2_TIER:STANDARD}
    - code: DLR-003
      name: ${DEMO_DEALER_3_NAME:Demo Dealer Myanmar}
      phone: ${DEMO_DEALER_3_PHONE:}
      country: ${DEMO_DEALER_3_COUNTRY:MM}
      tier: ${DEMO_DEALER_3_TIER:STANDARD}
    - code: DLR-004
      name: ${DEMO_DEALER_4_NAME:Demo Dealer Cambodia}
      phone: ${DEMO_DEALER_4_PHONE:}
      country: ${DEMO_DEALER_4_COUNTRY:KH}
      tier: ${DEMO_DEALER_4_TIER:STANDARD}

# WHATSAPP_* names are read first; the short names (PHONE_NUMBER_ID, ACCESS_TOKEN,
# APP_SECRET, VERIFY_TOKEN) work as fallbacks.
whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:${PHONE_NUMBER_ID:}}
  access-token: ${WHATSAPP_ACCESS_TOKEN:${ACCESS_TOKEN:}}
  app-secret: ${WHATSAPP_APP_SECRET:${APP_SECRET:}}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:${VERIFY_TOKEN:}}
  graph-api-base-url: https://graph.facebook.com
  graph-api-version: v23.0
  # Business number used in wa.me links (digits only). Optional: learned from webhook metadata when blank.
  business-phone: ${WHATSAPP_BUSINESS_PHONE:}

webhook:
  dedupe-cache-size: 10000

logging:
  level:
    com.nextasean.wawebhook: INFO
