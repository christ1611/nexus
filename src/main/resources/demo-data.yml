# Demo data for the stubbed document check and the mock verification providers.
demo-data:
  # How long the stub "looks at" each photo before answering.
  check-delay: 2s
  # Sample fields the stub "extracts" from every KTP photo.
  # The LAST DIGIT of the NIK drives the mock providers: 0-6 match, 7 mismatch, 8 not found, 9 timeout.
  # Caption tricks while demoing: "blur" fails the check; "nik7" (any digit) overrides the NIK's last digit.
  extracted:
    name: Budi Santoso
    nik: "3171051705900001"
    dob: "1990-05-17"
    address: "Jl. Merdeka No. 10, RT 03/RW 05, Gambir, Jakarta Pusat 10110"

verification:
  # Selects the ID verification and credit bureau providers (ID = Dukcapil + PEFINDO mocks).
  country: ${VERIFICATION_COUNTRY:ID}
  min-latency: 1s
  max-latency: 3s
