<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NEXUS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2d77"/>
      <stop offset="0.55" stop-color="#0a31a8"/>
      <stop offset="1" stop-color="#1c56ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- NEXUS: an N drawn as a network of connected nodes -->
  <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="150" y1="376" x2="150" y2="136"/>
    <line x1="150" y1="136" x2="362" y2="376"/>
    <line x1="362" y1="376" x2="362" y2="136"/>
  </g>
  <g fill="#ffffff">
    <circle cx="150" cy="136" r="40"/>
    <circle cx="150" cy="376" r="40"/>
    <circle cx="362" cy="376" r="40"/>
  </g>
  <!-- the sky accent marks the connection point -->
  <circle cx="362" cy="136" r="46" fill="#00b2ff"/>
  <circle cx="362" cy="136" r="18" fill="#ffffff"/>
</svg>
