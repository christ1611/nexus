    if (!r) h += `<p class="empty">${t('리스크 평가 전입니다.', 'Not assessed yet.')}</p>`;
    else if (!r.flags.length) h += `<p class="notice ok">${t('경고 없음', 'No warnings')}</p>`;
    else h += r.flags.map(flagRow).join('');
    h += `<details style="margin-top:8px"><summary>${t('등급 산정 기준', 'How the grade is computed')}</summary><p class="sub" style="margin:6px 0 0">${t("점수 = 심각도 합계(낮음 10 · 중간 20 · 높음 35, 최대 100). A 0-14 · B 15-39 · C 40-69 · D 70+. 심각도 '높음'의 위조 신호가 하나라도 있으면 최소 C. 등급은 코드의 규칙이 계산하며 모델이 직접 정하지 않습니다.", 'Score = sum of flag severities (LOW 10 · MEDIUM 20 · HIGH 35, capped at 100). A 0-14 · B 15-39 · C 40-69 · D 70+. Any HIGH fraud signal floors the grade at C. The grade is computed by code rules, not by the model.')}</p></details></div></details>`;

    // fraud network: filled in asynchronously when this application is tied to others
    h += '<div id="fraud-links"></div>';

    // reviewer copilot, under the evidence panels
    h += `<div class="card copilot" id="copilot" style="margin-top:16px">${renderCopilot(a)}</div>`;

    // the AI agent timeline (Step 4b), folded by default; kept fresh by the trace poll
    const liveTrace = !final;
    const trace = a.agentTrace || [];
    const prevLastId = traceLastId;                                   // highlight only what arrived since the last render
    traceLastId = trace.length ? trace[trace.length - 1].id : 0;
    traceSeenUpdatedAt = a.updatedAt;
    h += `<div class="card" id="trace-card" style="margin-top:16px">${renderTraceSection(trace, liveTrace, prevLastId)}</div>`;

    // actions
    h += `<div class="card" style="margin-top:16px"><div style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between"><h2 style="margin:0">${t('심사 결정', 'Decisions')} <small>${t('알림은 WhatsApp으로 딜러와 고객에게 전송됩니다', 'notifications go to the dealer and the customer on WhatsApp')}</small></h2><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button type="button" id="btn-report" title="${t('이 고객의 리포트를 팝업으로 봅니다', 'Open this customer\'s report in a popup')}">📄 ${t('고객 리포트', 'Customer report')}</button><button type="button" id="btn-decision-report" title="${a.decisionReport?.available ? t(`결정 시점에 자동 생성된 근거 보고서 (${fmtTime(a.decisionReport.generatedAt)})`, `Evidence report generated at decision time (${fmtTime(a.decisionReport.generatedAt)})`) : t('결정 전에는 현재 데이터로 임시본을 만듭니다', 'Before a decision this renders a draft from the current data')}">📑 ${t('근거 보고서 PDF', 'Evidence report PDF')}${a.decisionReport?.available ? '' : ` <span class="sub" style="color:inherit;opacity:.7">${t('임시본', 'draft')}</span>`}</button></div></div>
      ${final ? `<p class="empty">${t('결정이 완료된 신청입니다. 메모만 추가할 수 있습니다.', 'This application is decided. Only notes can be added.')}</p>` : ''}
      <div class="actions">
        <div class="action"><h3>${t('승인 / 거절', 'Approve / reject')}</h3>
          <label>${t('메모 (고객·딜러에게 전달됨)', 'Note (sent with the notification)')}</label><textarea id="dec-note" ${final ? 'disabled' : ''} placeholder="${t('예: 서류와 신원·신용 조회 모두 정상', 'e.g. documents and lookups all in order')}"></textarea>
          <div class="btns"><button class="approve" id="btn-approve" ${final ? 'disabled' : ''}>✓ ${t('승인', 'Approve')}</button><button class="reject" id="btn-reject" ${final ? 'disabled' : ''}>✕ ${t('거절', 'Reject')}</button></div></div>
        <div class="action"><h3>${t('고객 서류 재요청', 'Ask the customer to resend')}</h3>
          <label class="inline"><input type="checkbox" id="rq-ktp" ${noPhone ? 'disabled' : ''}> ${pair(DOC, 'KTP')}</label>
          <input type="text" id="rq-ktp-reason" placeholder="${t('이유 (고객에게 영어로 전달) e.g. the photo is blurry', 'Reason, sent to the customer in English, e.g. the photo is blurry')}" style="width:100%" ${noPhone ? 'disabled' : ''}>
          <label class="inline" style="margin-top:6px"><input type="checkbox" id="rq-selfie" ${noPhone ? 'disabled' : ''}> ${pair(DOC, 'SELFIE_KTP')}</label>
          <input type="text" id="rq-selfie-reason" placeholder="e.g. your face is not clearly visible" style="width:100%" ${noPhone ? 'disabled' : ''}>
          <label>${t('추가 안내 (선택)', 'Extra note (optional)')}</label><input type="text" id="rq-note" style="width:100%" ${noPhone ? 'disabled' : ''}>
          <div class="btns"><button id="btn-request-docs" ${noPhone ? 'disabled' : ''}>📷 ${t('고객에게 재요청', 'Ask the customer')}</button>${!a.customerPhone ? `<span class="sub">${t('고객 번호가 아직 없습니다', 'No customer number yet')}</span>` : ''}</div></div>
        <div class="action"><h3>${t('딜러 폼 재제출 · 메모 · 재평가', 'Dealer form · note · re-assess')}</h3>
          <label>${t('딜러 폼 재제출 이유', 'Reason for the dealer to resubmit the form')} <span class="sub">${t('딜러에게 새 일회용 링크가 전송됩니다', 'a new one-time link goes to the dealer')}</span></label><input type="text" id="rs-reason" style="width:100%" ${final ? 'disabled' : ''} placeholder="e.g. income field missing">
          <div class="btns"><button id="btn-resubmit" ${final ? 'disabled' : ''}>🔗 ${t('딜러 재제출 요청', 'Request resubmission')}</button><button id="btn-reassess" ${!r ? 'disabled' : ''}>↻ ${t('리스크 재평가', 'Re-assess risk')}</button></div>
          <label>${t('심사 메모', 'Review note')} <span class="sub">${t('내부 메모, 이력에만 기록', 'internal, timeline only')}</span></label><input type="text" id="note-text" style="width:100%">
          <div class="btns"><button id="btn-note">✎ ${t('메모 추가', 'Add note')}</button></div></div>
      </div></div>`;

    // documents
    // timeline
    h += `<div class="card" style="margin-top:16px"><h2>${t('심사 이력', 'Timeline')}</h2>${(a.events || []).length ? `<ul class="timeline">${a.events.map(eventRow).join('')}</ul>` : `<p class="empty">${t('아직 이력이 없습니다.', 'No history yet.')}</p>`}</div>`;

    detail.innerHTML = h;
    watchStagePanel();
    bindTips(detail);
    bindActions(a, final);
    bindCopilot(a);
    loadImages(a);
    loadFraudLinks(a);
    if (liveTrace) startTracePolling(a.applicationNumber); else stopTracePolling();
  }

  const extractedList = x => `<dl class="kv"><dt>${t('이름', 'Name')}</dt><dd>${esc(x.name || '–')}</dd><dt>NIK</dt><dd>${esc(x.nik || '–')}</dd><dt>${t('생년월일', 'Date of birth')}</dt><dd>${esc(x.dob || '–')}</dd><dt>${t('주소', 'Address')}</dt><dd>${esc(x.address || '–')}</dd></dl>`;
  const lookupList = a => `<dl class="kv">
        <dt>${t('신원 조회', 'Identity')}</dt><dd>${outcome(a.idVerification)}</dd>
        <dt>${t('신용 조회', 'Credit')}</dt><dd>${outcome(a.creditCheck)}${a.creditCheck?.score != null ? ` · ${t('점수', 'score')} <b>${a.creditCheck.score}</b>` : ''}</dd>
        <dt>${t('조회 시각', 'Checked at')}</dt><dd>${fmtTime(a.verifiedAt)}</dd></dl>`;
  const flagRow = f => `<div class="flag"><span class="sev" style="color:${SEV[f.severity].color}" title="${esc(f.severity)}">${SEV[f.severity].icon}</span><div><div class="t">${f.fraud ? '<span class="bad">⚠</span> ' : ''}${esc(L(f, 'title'))} <span class="sub">${esc(LANG.lang === 'en' ? f.source.toLowerCase().replace(/_/g, ' ') : f.sourceKo)} · ${t('심각도', 'severity')} ${esc(t(f.severityKo, SEV[f.severity]?.en || f.severity))}</span></div><div class="d">${esc(f.detail)}</div></div></div>`;
  const eventRow = e => `<li><time>${fmtTime(e.createdAt)}</time><div><b>${esc(L(e))}</b>${e.actor ? ` <span class="sub">${esc(e.actor)}</span>` : ''}${e.detail ? '<br>' + esc(e.detail) : ''}</div></li>`;

  function outcome(o) {
    if (!o) return '–';
    const cls = o.status === 'MATCH' ? 'ok' : (o.status === 'MISMATCH' ? 'bad' : 'mid');
    return `<span class="${cls}">${esc(pair(OUTCOME, o.status))}</span><br><span class="sub">${esc(o.detail || '')}</span>`;
  }

  function docCard(d) {
    let an = null; try { an = d.analysis ? JSON.parse(d.analysis) : null; } catch {}
    const check = d.checkPassed == null ? `<span class="mid">${t('검사 중', 'checking')}</span>` : d.checkPassed ? `<span class="ok">${t('검사 통과', 'check passed')}</span>` : `<span class="bad">${t('검사 실패', 'check failed')}</span> <span class="sub">${esc(d.checkReason || '')}</span>`;
    let h = `<div class="doc ${d.superseded ? 'superseded' : ''}" data-id="${d.id}">
      <div class="img" data-url="${esc(d.fileUrl)}" data-available="${d.fileAvailable}">${d.fileAvailable ? t('이미지 불러오는 중…', 'Loading image…') : t('파일이 디스크에 없습니다', 'File missing on disk')}</div>
      <div style="margin-top:8px"><b>${esc(DOC[d.type] ? pair(DOC, d.type) : d.typeLabel)}</b> ${d.superseded ? `<span class="chip">${t('이전 제출본', 'superseded')}</span>` : ''} ${d.needsOfficerReview ? `<span class="chip warn">${t('담당자 검토', 'officer review')}</span>` : ''}</div>
      <div class="meta">${check}<br>${fmtTime(d.createdAt)}${d.caption ? ' · ' + t('캡션', 'caption') + ': ' + esc(d.caption) : ''}${d.detectedType ? '<br>' + t('감지', 'detected') + ': ' + esc(d.detectedType) : ''}</div>`;
    if (an) {
      const issues = (an.qualityIssues || []).map(q => `<span class="chip ${q.severity === 'HIGH' ? 'fraud' : q.severity === 'MEDIUM' ? 'warn' : ''}" data-tip="${esc(q.detail)}">${esc(q.type)} · ${esc(q.severity)}</span>`).join('');
      const tamper = (an.tamperSignals || []).map(q => `<span class="chip fraud" data-tip="${esc(q.detail)}">⚠ ${esc(pair(TAMPER, q.type))} · ${esc(q.severity)}</span>`).join('');
      const fields = (an.fields || []).filter(f => f.value != null || f.status !== 'NOT_VISIBLE');
      h += `<details style="margin-top:6px"><summary>${t('분석 상세', 'Analysis details')} · ${esc(an.documentType)} ${pct(an.documentTypeConfidence)}${an.needsOfficerReview ? ' · ' + t('담당자 검토', 'officer review') : ''}</summary>
        <div style="margin-top:6px">${issues || `<span class="sub">${t('품질 문제 없음', 'No quality issues')}</span>`}</div>
        ${tamper ? `<div style="margin-top:6px"><b class="bad">${t('위조 의심 요소', 'Forgery evidence')}</b><br>${tamper}</div>` : (an.requestedType === 'KTP' && an.model && !String(an.model).startsWith('stub') ? `<div class="sub" style="margin-top:4px">${t('위조 흔적 없음', 'No forgery evidence seen')}</div>` : '')}
        ${fields.length ? `<table style="margin-top:6px"><thead><tr><th>${t('필드', 'Field')}</th><th>${t('값', 'Value')}</th><th class="num">${t('신뢰도', 'Confidence')}</th></tr></thead><tbody>${fields.map(f => `<tr><td>${esc(f.name.replace(/_/g, ' '))}</td><td>${esc(f.value ?? '–')}${f.status === 'NEEDS_OFFICER_REVIEW' ? ` <span class="chip warn">${t('검토', 'review')}</span>` : ''}${f.note ? `<br><span class="sub">${esc(f.note)}</span>` : ''}</td><td class="num">${pct(f.confidence)}</td></tr>`).join('')}</tbody></table>` : ''}
        ${an.nik ? `<div style="margin-top:6px"><b>${t('NIK 검증', 'NIK validation')}: </b>${an.nik.issues && an.nik.issues.length ? `<span class="bad">${t('실패', 'failed')}</span><ul style="margin:4px 0 0 16px;padding:0">${an.nik.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : `<span class="ok">${t('통과', 'passed')}</span>`} <span class="sub">${esc(an.nik.provinceName || '')} ${an.nik.dobFromNik ? '· ' + t('생년월일', 'DOB') + ' ' + esc(an.nik.dobFromNik) : ''} ${an.nik.genderFromNik ? '· ' + esc(an.nik.genderFromNik) : ''}</span></div>` : ''}
        ${(an.reviewReasons || []).length ? `<div style="margin-top:6px"><b>${t('검토 사유', 'Review reasons')}:</b><ul style="margin:4px 0 0 16px;padding:0">${an.reviewReasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${an.modelNotes ? `<div class="sub" style="margin-top:6px">${esc(an.modelNotes)}</div>` : ''}
        <div class="sub" style="margin-top:4px">model: ${esc(an.model || '')}</div></details>`;
    }
    return h + '</div>';
  }

  /* Fraud network: the ring this application belongs to (same ID number, phone or name on other applications). The
     network is computed for all applications, so it is fetched once a minute and shared between detail views. */
  const LINK_LABEL = { SAME_ID: ['같은 신분증 번호', 'same ID number'], SAME_PHONE: ['같은 전화번호', 'same phone'], DUPLICATE: ['중복 신청', 'duplicate application'], SAME_NAME: ['같은 이름·생년월일', 'same name & DOB'] };
  let networkCache = null, networkAt = 0;
  async function loadFraudLinks(a) {
    const slot = $('#fraud-links'); if (!slot) return;
    try {
      if (!networkCache || Date.now() - networkAt > 60000) { networkCache = await api('/admin/fraud-network'); networkAt = Date.now(); }
      if (!current || current.applicationNumber !== a.applicationNumber || !detail.contains(slot)) return;
      const cluster = networkCache.clusters.find(c => c.applications.includes(a.applicationNumber));
      if (!cluster) return;
      const me = networkCache.nodes.find(x => x.type === 'application' && x.number === a.applicationNumber);
      const byId = Object.fromEntries(networkCache.nodes.map(x => [x.id, x]));
      const ties = networkCache.links.filter(l => l.kind !== 'DEALER' && (l.source === me?.id || l.target === me?.id)).map(l => ({ other: byId[l.source === me.id ? l.target : l.source], kind: l.kind, detail: l.detail }));
      const others = cluster.applications.filter(n => n !== a.applicationNumber);
      slot.innerHTML = `<div class="card" style="margin-top:16px;border-color:${cluster.severity === 'HIGH' ? 'var(--critical)' : 'var(--warn)'}"><h2>${t('사기 연결망', 'Fraud network')} <small>${t(`이 신청은 다른 신청 ${others.length}건과 묶여 있어요`, `this application is tied to ${others.length} other application(s)`)}</small> <span class="chip ${cluster.severity === 'HIGH' ? 'fraud' : 'warn'}">${t('묶음', 'ring')} ${cluster.id} · ${cluster.severity === 'HIGH' ? t('높음', 'high') : t('중간', 'medium')}</span></h2>
        <div class="sub" style="margin-bottom:6px">${esc(LANG.lang === 'en' ? cluster.summary : cluster.summaryKo)}</div>
        ${ties.length ? `<ul class="timeline" style="margin-bottom:8px">${ties.map(x => `<li><time>${pair(LINK_LABEL, x.kind)}</time><div><a class="app" href="/review?app=${encodeURIComponent(x.other.number)}" data-open="${esc(x.other.number)}" style="color:var(--brand);font-weight:600;text-decoration:none">${esc(x.other.number)}</a> <span class="sub">${esc(x.other.name || '')} · ${statusName(x.other.status)}${x.other.grade ? ` · ${t('등급', 'grade')} ${x.other.grade}` : ''} · ${t('딜러', 'dealer')} ${esc(x.other.dealerCode || '–')}${x.detail ? ' · ' + esc(x.detail) : ''}</span></div></li>`).join('')}</ul>` : ''}
        ${others.some(n => !ties.find(x => x.other.number === n)) ? `<div class="sub" style="margin-bottom:6px">${t('같은 묶음의 다른 신청', 'Also in this ring')}: ${others.filter(n => !ties.find(x => x.other.number === n)).map(n => `<a class="app" href="/review?app=${encodeURIComponent(n)}" data-open="${esc(n)}" style="color:var(--brand);font-weight:600;text-decoration:none">${esc(n)}</a>`).join(' · ')}</div>` : ''}
        <a class="sub" href="/dashboard#risk" target="_blank" rel="noopener">${t('대시보드에서 연결망 그림 보기 →', 'See the network graph on the dashboard →')}</a></div>`;
      slot.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); open(el.dataset.open); }));
    } catch (e) { /* the detail is complete without it */ }
  }

  async function loadImages(a) {
    for (const el of detail.querySelectorAll('.doc .img')) {
      if (el.dataset.available !== 'true') continue;
      const url = el.dataset.url;
      try {
        let blob = blobs.get(url);
        if (!blob) {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          blob = URL.createObjectURL(await res.blob());
          blobs.set(url, blob);
        }
        if (!detail.contains(el)) continue;
        el.innerHTML = `<img src="${blob}" alt="document">`;
        el.addEventListener('click', () => { $('#lightbox img').src = blob; lightbox.style.display = 'flex'; });
      } catch (e) { el.textContent = t('이미지를 불러오지 못했습니다', 'Could not load the image') + ' (' + e.message + ')'; }
    }
  }
  lightbox.addEventListener('click', () => { lightbox.style.display = 'none'; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { lightbox.style.display = 'none'; closeReport(); } });

  /* Decision evidence report (PDF): fetched, then handed to the browser as a download. */
  async function downloadDecisionReport(number, btn) {
    if (btn) btn.disabled = true;
    setStatus(t('근거 보고서를 만드는 중…', 'Preparing the evidence report…'));
    try {
      const res = await fetch('/admin/applications/' + encodeURIComponent(number) + '/decision-report.pdf');
      if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.error || ('HTTP ' + res.status)); }
      const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || `decision-report-${number}.pdf`;
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      setStatus(t('근거 보고서 내려받음: ', 'Evidence report downloaded: ') + name);
    } catch (e) { errStatus(e); }
    finally { if (btn) btn.disabled = false; }
  }

  /* ---------- customer report popup ---------- */
  const sheet = $('#report .sheet');
  let reportNumber = null;                      // application shown in the popup, so a language switch can redraw it
  function closeReport() { report.style.display = 'none'; sheet.innerHTML = ''; reportNumber = null; }
  report.addEventListener('click', e => { if (e.target === report) closeReport(); });
  const closeBtn = () => `<button type="button" class="rp-close">✕ ${t('닫기', 'Close')}</button>`;

  async function showReport(number) {
    report.style.display = 'flex';
    reportNumber = number;
    sheet.innerHTML = `<div class="sheet-head"><h2 id="report-title">${esc(number)} <small class="sub">${t('고객 리포트', 'Customer report')}</small></h2><div class="sheet-tools">${closeBtn()}</div></div><p class="empty">${t('리포트를 불러오는 중…', 'Loading the report…')}</p>`;
    sheet.querySelector('.rp-close').addEventListener('click', closeReport);
    try {
      const a = current && current.applicationNumber === number ? current : await api('/admin/applications/' + encodeURIComponent(number));
      if (reportNumber !== number) return;
      sheet.innerHTML = reportHtml(a);
      sheet.querySelectorAll('.rp-close').forEach(b => b.addEventListener('click', closeReport));
      sheet.querySelector('.rp-print').addEventListener('click', () => window.print());
      sheet.querySelector('.rp-pdf').addEventListener('click', e => downloadDecisionReport(number, e.target.closest('button')));
      sheet.querySelector('.rp-open').addEventListener('click', () => { closeReport(); showTab('work'); open(number); });
      bindTips(sheet);
    } catch (e) {
      sheet.innerHTML = `<div class="sheet-head"><h2 id="report-title">${esc(number)}</h2><div class="sheet-tools">${closeBtn()}</div></div><p class="notice crit">${t('리포트를 불러오지 못했습니다', 'Could not load the report')}: ${esc(e.message)}</p>`;
      sheet.querySelector('.rp-close').addEventListener('click', closeReport);
    }
  }

  /* One-page report built from the application detail: who, risk, documents, checks, flags, agent summary, decision, history. */
  function reportHtml(a) {
    const r = a.risk, final = a.status === 'APPROVED' || a.status === 'REJECTED';
    const docs = (a.documents || []).filter(d => !d.superseded), superseded = (a.documents || []).filter(d => d.superseded).length;
    const g = GRADE[r?.grade] || { color: 'var(--text-3)' };
    const sec = (title, sub, body) => `<div class="sec"><h3>${title}${sub ? ` <small>${sub}</small>` : ''}</h3>${body}</div>`;
    const none = text => `<p class="empty" style="padding:4px 0">${text}</p>`;
    const docRow = d => {
      let an = null; try { an = d.analysis ? JSON.parse(d.analysis) : null; } catch {}
      const tamper = (an?.tamperSignals || []).length, issues = (an?.qualityIssues || []).length;
      const check = d.checkPassed == null ? `<span class="mid">${t('검사 중', 'checking')}</span>` : d.checkPassed ? `<span class="ok">${t('통과', 'passed')}</span>` : `<span class="bad">${t('실패', 'failed')}</span>${d.checkReason ? ` <span class="sub">${esc(d.checkReason)}</span>` : ''}`;
      return `<tr><td><b>${esc(DOC[d.type] ? pair(DOC, d.type) : d.typeLabel)}</b>${d.needsOfficerReview ? ` <span class="chip warn">${t('담당자 검토', 'officer review')}</span>` : ''}</td><td>${check}</td><td>${an ? `${esc(an.documentType || '')} ${pct(an.documentTypeConfidence)}` : '<span class="sub">–</span>'}</td><td>${tamper ? `<span class="bad">⚠ ${t('위조 의심', 'forgery signals')} ${tamper}</span>` : issues ? `<span class="mid">${t('품질 문제', 'quality issues')} ${issues}</span>` : `<span class="ok">${t('없음', 'none')}</span>`}</td><td class="num"><span class="sub">${fmtTime(d.createdAt)}</span></td></tr>`;
    };
    const events = (a.events || []).slice(-10).reverse();
    return `<div class="sheet-head">
        <div><h2 id="report-title">${esc(a.applicationNumber)} ${pill(a.status)}</h2>
          <div class="sub">${t('고객 리포트', 'Customer report')} · ${countryCell(a.country)} ${esc(countryName(a.country))} · ${t('딜러', 'dealer')} ${esc(a.dealerCode || '–')} ${esc(a.dealerName || '')}${a.dealerTier === 'EXCELLENT' ? ' ★' : ''}</div></div>
        <div class="sheet-tools no-print"><button type="button" class="rp-open">${t('상세 열기', 'Open detail')}</button><button type="button" class="rp-pdf">📑 ${t('근거 보고서 PDF', 'Evidence PDF')}</button><button type="button" class="rp-print">🖨 ${t('인쇄', 'Print')}</button>${closeBtn()}</div>
      </div>
      <div class="grid2">
        <div>${sec(t('고객', 'Customer'), '', `<dl class="kv"><dt>${t('이름', 'Name')}</dt><dd><b>${esc(customerName(a))}</b></dd><dt>${t('전화', 'Phone')}</dt><dd>${a.customerPhone ? '+' + esc(a.customerPhone) : `<span class="sub">${t('아직 없음', 'not yet')}</span>`}</dd><dt>${t('국가', 'Country')}</dt><dd>${esc(countryName(a.country) || a.country)}</dd><dt>${t('딜러', 'Dealer')}</dt><dd>${esc(a.dealerCode || '–')} ${esc(a.dealerName || '')}</dd><dt>${t('생성', 'Created')}</dt><dd>${fmtTime(a.createdAt)}</dd><dt>${t('최근 변경', 'Updated')}</dt><dd>${fmtTime(a.updatedAt)}</dd>${a.progress ? `<dt>${t('진행 단계', 'Stage')}</dt><dd>${esc(curStage(a.progress))} <span class="sub">${a.progress.done}/${a.progress.total}</span></dd>` : ''}</dl>`)}</div>
        <div>${sec(t('AI 리스크 등급', 'AI risk grade'), '', r ? `<div class="gradebox" style="border-color:${g.color}"><span class="big" style="color:${g.color}">${esc(r.grade)}</span><div><div><b>${esc(L(r, 'gradeLabel'))}</b></div><div class="sub">${t('점수', 'score')} ${r.score} / 100 · ${r.fraudWarnings ? `<span class="bad">⚠ ${t('위조·사기 경고', 'fraud / forgery warnings')} ${r.fraudWarnings}</span>` : t('위조 신호 없음', 'no fraud signal')}</div><div class="sub">${esc(methodName(r.method))} · ${fmtTime(r.assessedAt)}</div></div></div>
            <div style="margin-top:8px">${(r.badges || []).map(b => `<span class="chip badge" data-tip="${esc(b.description)}">✓ ${esc(L(b))}</span>`).join('') || `<span class="sub">${t('배지 없음', 'No badges')}</span>`}${a.review?.officerReviewRequired ? `<span class="chip warn">${t('담당자 검토 필요', 'Officer review required')}</span>` : ''}</div>` : none(t('리스크 미평가 (서류 미완료)', 'Not assessed yet (documents incomplete)')))}</div>
      </div>
      ${sec(t('추출 데이터', 'Extracted data'), t('신분증에서 읽은 값', 'from the ID document'), a.extracted ? extractedList(a.extracted) : none(t('아직 추출된 데이터가 없습니다.', 'No extracted data yet.')))}
      ${sec(t('신원·신용 조회', 'Identity & credit checks'), '', a.idVerification || a.creditCheck ? lookupList(a) : none(t('아직 조회가 실행되지 않았습니다.', 'Lookups have not run yet.')))}
      ${sec(t('서류', 'Documents'), t(`현재 ${docs.length}건${superseded ? ', 이전 제출본 ' + superseded + '건' : ''}`, `${docs.length} current${superseded ? ', ' + superseded + ' superseded' : ''}`), docs.length ? `<div class="scroll"><table><thead><tr><th>${t('서류', 'Document')}</th><th>${t('검사', 'Check')}</th><th>${t('감지 유형', 'Detected type')}</th><th>${t('위조·품질', 'Forgery / quality')}</th><th class="num">${t('접수', 'Received')}</th></tr></thead><tbody>${docs.map(docRow).join('')}</tbody></table></div>` : none(t('아직 접수된 서류가 없습니다.', 'No documents yet.')))}
      ${sec('Risk Flag · ' + t('근거', 'evidence'), '', !r ? none(t('리스크 평가 전입니다.', 'Not assessed yet.')) : !r.flags.length ? `<p class="notice ok" style="margin:0">${t('경고 없음', 'No warnings')}</p>` : r.flags.map(flagRow).join(''))}
      ${a.review ? sec(t('자동 리뷰 요약', 'Review agent summary'), `${esc(a.review.decision || '')} · ${t('라운드', 'rounds')} ${a.review.rounds}`, summaryOf(a.review) ? `<pre>${esc(summaryOf(a.review))}</pre>` : none(t('요약이 아직 없습니다.', 'No summary yet.'))) : ''}
      ${sec(t('심사 결정', 'Decision'), '', final ? `<div class="notice ${a.status === 'APPROVED' ? 'ok' : 'crit'}" style="margin:0"><b>${esc(statusName(a.status))}</b> · ${fmtTime(a.decidedAt || a.updatedAt)}${a.decidedBy ? ' · ' + esc(a.decidedBy) : ''}${a.decisionNote ? '<br>' + esc(a.decisionNote) : ''}</div>` : `<p class="empty" style="padding:4px 0">${t('아직 결정되지 않았습니다 · 현재 상태', 'Not decided yet · current status')} ${esc(statusName(a.status))}${a.resubmissionReason ? `<br><span class="sub">${esc(a.resubmissionReason)}</span>` : ''}</p>`)}
      ${sec(t('최근 이력', 'Recent history'), t(`최근 ${events.length}건 / 전체 ${(a.events || []).length}건`, `last ${events.length} of ${(a.events || []).length}`), events.length ? `<ul class="timeline">${events.map(eventRow).join('')}</ul>` : none(t('아직 이력이 없습니다.', 'No history yet.')))}
      <div class="foot"><span>NEXUS ASEAN · ${t('심사 백오피스 리포트', 'review back office report')}</span><span>${t('생성', 'generated')} ${fmtTime(new Date().toISOString())}${reviewerInput.value.trim() ? ' · ' + esc(reviewerInput.value.trim()) : ''}</span></div>`;
  }

  function bindActions(a, final) {
    const n = encodeURIComponent(a.applicationNumber), reviewer = () => reviewerInput.value.trim() || null;
    const after = (msg, res) => {
      const parts = [msg];
      if (res && typeof res.dealerNotified === 'boolean') parts.push(t('딜러 알림 ', 'dealer notified ') + (res.dealerNotified ? '✓' : '✗'));
      if (res && res.customerNotified != null) parts.push(t('고객 알림 ', 'customer notified ') + (res.customerNotified ? '✓' : '✗'));
      setStatus(parts.join(' · '));
      open(a.applicationNumber, true); loadQueue();
    };
    const run = async (btn, fn) => { btn.disabled = true; setStatus(t('처리 중…', 'Working…')); try { await fn(); } catch (e) { errStatus(e); btn.disabled = false; } };
    const confirmDecision = verb => confirm(t(`${a.applicationNumber} 을(를) ${verb[0]}할까요? 딜러와 고객에게 WhatsApp 알림이 전송됩니다.`, `${verb[1]} ${a.applicationNumber}? The dealer and the customer will be notified on WhatsApp.`));
    if (!final) {
      $('#btn-approve').addEventListener('click', e => { if (!confirmDecision(['승인', 'Approve'])) return; run(e.target, async () => after(t('승인 완료', 'Approved'), await api('/admin/applications/' + n + '/decision', { method: 'POST', body: JSON.stringify({ decision: 'APPROVED', note: $('#dec-note').value, reviewer: reviewer() }) }))); });
      $('#btn-reject').addEventListener('click', e => { if (!confirmDecision(['거절', 'Reject'])) return; run(e.target, async () => after(t('거절 완료', 'Rejected'), await api('/admin/applications/' + n + '/decision', { method: 'POST', body: JSON.stringify({ decision: 'REJECTED', note: $('#dec-note').value, reviewer: reviewer() }) }))); });
      $('#btn-resubmit').addEventListener('click', e => { const reason = $('#rs-reason').value.trim(); if (!reason) { setStatus(t('재제출 이유를 입력하세요.', 'Enter a reason for the resubmission.'), true); return; } run(e.target, async () => after(t('딜러에게 재제출 요청 전송', 'Resubmission request sent to the dealer'), await api('/admin/applications/' + n + '/request-resubmission', { method: 'POST', body: JSON.stringify({ reason, reviewer: reviewer() }) }))); });
      if (a.customerPhone) $('#btn-request-docs').addEventListener('click', e => {
        const items = [];
        if ($('#rq-ktp').checked) items.push({ type: 'KTP', reason: $('#rq-ktp-reason').value.trim() || 'please send a clearer photo of your KTP' });
        if ($('#rq-selfie').checked) items.push({ type: 'SELFIE_KTP', reason: $('#rq-selfie-reason').value.trim() || 'please send a clearer selfie holding your KTP' });
        if (!items.length) { setStatus(t('재요청할 서류를 선택하세요.', 'Select the documents to request.'), true); return; }
        run(e.target, async () => after(t('고객에게 서류 재요청 전송', 'Document request sent to the customer'), await api('/admin/applications/' + n + '/request-documents', { method: 'POST', body: JSON.stringify({ items, note: $('#rq-note').value.trim() || null, reviewer: reviewer() }) })));
      });
    }
    $('#btn-reassess').addEventListener('click', e => run(e.target, async () => { await api('/admin/applications/' + n + '/assess-risk' + (reviewer() ? '?reviewer=' + encodeURIComponent(reviewer()) : ''), { method: 'POST' }); after(t('리스크 재평가 완료', 'Risk re-assessed')); }));
    $('#btn-report').addEventListener('click', () => showReport(a.applicationNumber));
    $('#btn-decision-report').addEventListener('click', e => downloadDecisionReport(a.applicationNumber, e.target.closest('button')));
    $('#btn-note').addEventListener('click', e => { const note = $('#note-text').value.trim(); if (!note) { setStatus(t('메모를 입력하세요.', 'Enter a note.'), true); return; } run(e.target, async () => { await api('/admin/applications/' + n + '/note', { method: 'POST', body: JSON.stringify({ note, reviewer: reviewer() }) }); after(t('메모 추가 완료', 'Note added')); }); });
  }

  /* ---------- new application (demo start without a dealer phone) ---------- */
  let dealersLoaded = false;
  async function loadDealers() {
    if (dealersLoaded) return;
    try {
      const list = await api('/admin/dealers');
      const sel = $('#na-dealer');
      list.filter(d => d.active).forEach(d => { const o = document.createElement('option'); o.value = d.code; o.textContent = `${d.code} · ${d.name} (${d.country})`; sel.appendChild(o); });
      dealersLoaded = true;
    } catch (e) { /* the default dealer is used server-side */ }
  }
  function qrSvg(text) {
    try {
      if (typeof qrcode !== 'function') return '';
      const q = qrcode(0, 'M'); q.addData(text); q.make();
      return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch { return ''; }
  }
  $('#na-create').addEventListener('click', async e => {
    const phone = $('#na-phone').value.trim(), name = $('#na-name').value.trim();
    if (phone && !/^\d{8,15}$/.test(phone)) { $('#na-status').textContent = t('전화번호는 국가코드 포함 숫자만 (8-15자리)', 'Phone: digits only with country code (8-15 digits)'); return; }
    e.target.disabled = true; $('#na-status').textContent = t('생성 중…', 'Creating…');
    try {
      const r = await api('/admin/applications', { method: 'POST', body: JSON.stringify({ customerPhone: phone || null, customerName: name || null, dealerCode: $('#na-dealer').value || null, invite: $('#na-invite').checked, reviewer: reviewerInput.value.trim() || null }) });
      const n = r.application.applicationNumber;
      const invite = !r.customerInvited ? `<span class="sub">${t('고객 번호 없음 · 고객이 아래 링크(또는 QR)로 시작합니다', 'No customer number · the customer starts from the link (or QR) below')}</span>`
        : r.inviteSent === true ? `<span class="ok">✓ ${t('WhatsApp 초대 요청됨', 'WhatsApp invitation requested')}</span> <span class="sub">${t('고객은 아무 메시지나 보내면 시작됩니다 (예: START). 24시간 창 밖이면 Meta가 나중에 "전송 실패"를 보내며 심사 이력에 기록됩니다 — 그때는 고객이 먼저 "hi"를 보내면 됩니다', 'The customer starts by sending any message (e.g. START). Outside the 24-hour window Meta reports a delivery failure later, recorded in the timeline; then the customer just sends "hi" first.')}</span>`
        : r.inviteSent === false ? `<span class="bad">✗ ${t('WhatsApp 전송 실패', 'WhatsApp delivery failed')}</span> <span class="sub">${t('고객이 먼저 이 번호로 메시지를 보내면(24시간 창) 자동으로 시작되고, QR을 스캔해도 됩니다', 'It starts automatically once the customer messages this number first (24-hour window), or scans the QR.')}</span>`
        : `<span class="sub">${t('초대 메시지는 보내지 않음 · 고객이 아무 메시지나 보내면 시작됩니다', 'No invitation sent · the customer starts by sending any message')}</span>`;
      const link = r.startLink || '';
      $('#na-result').innerHTML = `<div class="result">
        <div><b>${esc(n)}</b> ${t('생성됨', 'created')} · <a class="app" href="/review?app=${encodeURIComponent(n)}" data-open="${esc(n)}">${t('상세 열기 →', 'Open detail →')}</a></div>
        <div style="margin-top:4px">${invite}</div>
        <div class="qr">${link ? qrSvg(link) : ''}<div>
          <div class="sub">${t('고객 폰으로 스캔하면 WhatsApp이 열리고', 'Scanned on the customer\'s phone, WhatsApp opens with')} <b>${esc(r.startText)}</b>${t('가 입력되어 있습니다.', ' pre-filled.')}</div>
          ${link ? `<div class="link" style="margin-top:6px">${esc(link)}</div><div class="btns"><button id="na-copy">${t('링크 복사', 'Copy link')}</button></div>` : `<div class="sub" style="margin-top:6px">${t('비즈니스 번호를 아직 모릅니다 (첫 웹훅 수신 후 또는 WHATSAPP_BUSINESS_PHONE 설정). 고객에게', 'The business number is not known yet (after the first webhook, or set WHATSAPP_BUSINESS_PHONE). Ask the customer to send')} "${esc(r.startText)}"${t(' 전송을 안내하세요.', '.')}</div>`}
        </div></div></div>`;
      $('#na-status').textContent = '';
      $('#na-result').querySelector('[data-open]')?.addEventListener('click', ev => { ev.preventDefault(); open(n); });
      $('#na-copy')?.addEventListener('click', async () => { try { await navigator.clipboard.writeText(link); $('#na-status').textContent = t('복사됨', 'Copied'); } catch { $('#na-status').textContent = t('복사 실패: 링크를 직접 선택하세요', 'Copy failed: select the link by hand'); } });
      loadQueue();
    } catch (err) { $('#na-status').textContent = t('오류: ', 'Error: ') + err.message; }
    finally { e.target.disabled = false; }
  });

  /* ---------- statistics tab ---------- */
  const statsPanel = $('#stats'), queuePanel = $('#queue');
  let activeTab = 'work', statsLoadedAt = 0, lastStats = null;
  try { activeTab = sessionStorage.getItem('reviewTab') || activeTab; } catch {}
  if (location.hash === '#stats') activeTab = 'stats';

  function showTab(id) {
    activeTab = id === 'stats' ? 'stats' : 'work';
    try { sessionStorage.setItem('reviewTab', activeTab); } catch {}
    const h = activeTab === 'stats' ? '#stats' : '';
    if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
    document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === activeTab)));
    queuePanel.hidden = detail.hidden = activeTab === 'stats';
    statsPanel.hidden = activeTab !== 'stats';
    if (activeTab === 'stats' && Date.now() - statsLoadedAt > 15000) loadStats();
  }
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
  window.addEventListener('hashchange', () => showTab(location.hash === '#stats' ? 'stats' : 'work'));

  async function loadStats() {
    try {
      const d = await api('/admin/review/stats');
      statsLoadedAt = Date.now();
      lastStats = d;
      renderStats(d);
    } catch (e) { errStatus(e); }
  }

  const hrs = h => h == null ? '–' : h < 1 ? Math.round(h * 60) + t('분', 'm') : h < 48 ? h.toFixed(1) + 'h' : (h / 24).toFixed(1) + 'd';
  const rate = v => v == null ? '–' : Math.round(v * 100) + '%';

  /* Horizontal bars: rows = [{label, value, color, tip}]. */
  function hbars(rows, opts = {}) {
    const W = 520, rowH = 26, left = opts.left || 120, right = 44, top = 4;
    const H = top + rows.length * rowH + 4;
    const max = Math.max(1, ...rows.map(r => r.value));
    const scale = v => (W - left - right) * v / max;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">`;
    [0.25, 0.5, 0.75, 1].forEach(f => { const x = left + scale(max * f); s += `<line class="grid" x1="${x}" x2="${x}" y1="${top}" y2="${H - 4}"/>`; });
    rows.forEach((r, i) => {
      const y = top + i * rowH + 5, h = rowH - 10, w = Math.max(r.value > 0 ? 4 : 0, scale(r.value));
      s += `<text x="${left - 8}" y="${y + h / 2 + 4}" text-anchor="end" class="lbl">${esc(r.label)}</text>`;
      if (w > 0) s += `<path class="bar" data-tip="${esc(r.tip || r.label + ': ' + r.value)}" d="M${left},${y} h${w - 4} a4,4 0 0 1 4,4 v${h - 8} a4,4 0 0 1 -4,4 h-${w - 4} z" fill="${r.color}"/>`;
      s += `<text x="${left + w + 6}" y="${y + h / 2 + 4}">${r.value}</text>`;
    });
    return s + '</svg>';
  }

  /* Daily chart: stacked decision columns (approved, rejected) and a line for applications that became ready for review. */
  function dailyChart(days) {
    const W = 560, H = 190, left = 30, right = 8, top = 10, bottom = 26;
    const max = Math.max(1, ...days.map(x => Math.max(x.approved + x.rejected, x.completed)));
    const iw = (W - left - right) / days.length, y = v => top + (H - top - bottom) * (1 - v / max);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily decisions and arrivals">`;
    [0, 0.5, 1].forEach(f => { const yy = y(max * f); s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${yy}" y2="${yy}"/><text x="${left - 6}" y="${yy + 4}" text-anchor="end">${Math.round(max * f)}</text>`; });
    days.forEach((d, i) => {
      const x = left + i * iw + iw * 0.2, bw = iw * 0.6;
      const yA = y(d.approved), yR = y(d.approved + d.rejected);
      if (d.approved) s += `<rect class="bar" x="${x}" y="${yA}" width="${bw}" height="${y(0) - yA}" fill="var(--good)" data-tip="${esc(d.date)} · ${t('승인', 'approved')} ${d.approved}"/>`;
      if (d.rejected) s += `<rect class="bar" x="${x}" y="${yR}" width="${bw}" height="${yA - yR}" fill="var(--critical)" data-tip="${esc(d.date)} · ${t('거절', 'rejected')} ${d.rejected}"/>`;
      if (i % 2 === 0 || days.length <= 8) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
    });
    const pts = days.map((d, i) => `${left + i * iw + iw / 2},${y(d.completed)}`);
    s += `<polyline class="line" points="${pts.join(' ')}"/>`;
    days.forEach((d, i) => { s += `<circle class="pt" cx="${left + i * iw + iw / 2}" cy="${y(d.completed)}" r="2.5" data-tip="${esc(d.date)} · ${t('심사 대기 진입', 'ready for review')} ${d.completed}"/>`; });
    return s + '</svg>';
  }

  function renderStats(d) {
    const w = d.workload, th = d.throughput;
    $('#n-stats').textContent = w.readyForReview; $('#n-stats').hidden = !w.readyForReview;
    const tile = (label, v, cls = '') => `<div class="tile ${cls}"><div class="k">${label}</div><div class="v">${v}</div></div>`;
    let h = `<div class="card"><h2>${t('지금 내 책상 위', 'Workload right now')}</h2><div class="tiles">
      ${tile(t('심사 대기', 'Ready for review'), w.readyForReview)}
      ${tile(t('고위험 대기 (C·D)', 'High-risk waiting (C·D)'), w.highRiskWaiting, w.highRiskWaiting ? 'alert' : '')}
      ${tile(t('위조·사기 경고 대기', 'Fraud warnings waiting'), w.fraudWaiting, w.fraudWaiting ? 'alert' : '')}
      ${tile(t('담당자 검토 필요', 'Flagged by the agent'), w.officerReviewRequired)}
      ${tile(t('고객 서류 재요청 중', 'Waiting on the customer'), w.documentsRequested)}
      ${tile(t('딜러 재제출 대기', 'Waiting on the dealer'), w.resubmissionRequested)}
      ${tile(t('최장 대기', 'Oldest waiting'), hrs(w.oldestWaitingHours), w.oldestWaitingHours >= 72 ? 'alert' : '')}
      ${tile(t('평균 대기', 'Average waiting'), hrs(w.avgWaitingHours))}
    </div></div>`;

    h += `<div class="card"><h2>${t('처리 속도', 'Throughput')}</h2><div class="tiles">
      ${tile(t('오늘 결정', 'Decided today'), th.decidedToday)}
      ${tile(t('7일 결정', 'Decided, 7 days'), `${th.decided7d} <span class="sub">✓${th.approved7d} ✕${th.rejected7d}</span>`)}
      ${tile(t('30일 결정', 'Decided, 30 days'), `${th.decided30d} <span class="sub">✓${th.approved30d} ✕${th.rejected30d}</span>`)}
      ${tile(t('30일 승인율', 'Approval rate, 30 days'), rate(th.approvalRate30d))}
      ${tile(t('평균 결정 시간 (7일)', 'Avg time to decision, 7 d'), hrs(th.avgDecisionHours7d))}
      ${tile(t('평균 결정 시간 (30일)', 'Avg time to decision, 30 d'), hrs(th.avgDecisionHours30d))}
      ${tile(t('고객 서류 재요청 (7일 / 30일)', 'Doc re-requests (7 d / 30 d)'), `${th.documentsRequested7d} <span class="sub">/ ${th.documentsRequested30d}</span>`)}
      ${tile(t('2회 이상 심사 라운드', 'Decided after 2+ rounds'), `${th.multiRoundDecided} <span class="sub">avg ${th.avgRoundsDecided == null ? '–' : th.avgRoundsDecided.toFixed(1)}</span>`)}
    </div></div>`;

    h += `<div class="srow">
      <div class="card"><h2>${t('대기 시간 분포', 'Waiting time of the queue')}</h2>${hbars([
        { label: t('24시간 미만', 'under 24 h'), value: w.waitingUnder24h, color: 'var(--good)' },
        { label: t('1-3일', '1-3 days'), value: w.waiting1to3d, color: 'var(--warn)' },
        { label: t('3일 초과', 'over 3 days'), value: w.waitingOver3d, color: 'var(--critical)' },
      ], { left: 90, aria: 'Waiting time buckets' })}
      <p class="sub" style="margin:8px 0 0">${t('3일을 넘긴 건부터 처리하세요.', 'Start with anything over three days.')}</p></div>
      <div class="card"><h2>${t('등급별 대기', 'Queue by AI risk grade')}</h2>${hbars(w.queueByGrade.map(g => ({ label: g.grade === 'NONE' ? L(g) : `${g.grade} ${L(g)}`, value: g.waiting, color: GRADE[g.grade]?.color || 'var(--text-3)', tip: `${g.grade} · ${L(g)}: ${g.waiting}` })), { left: 100, aria: 'Queue by grade' })}</div>
      <div class="card"><h2>${t('국가별 대기', 'Queue by country')}</h2><div class="scroll"><table><thead><tr><th>${t('국가', 'Country')}</th><th class="num">${t('대기', 'Waiting')}</th><th class="num">${t('고위험', 'High risk')}</th><th class="num">${t('최장 대기', 'Oldest')}</th></tr></thead><tbody>
        ${w.queueByCountry.map(c => `<tr><td>${countryCell(c.code)} ${esc(L(c, 'name'))}</td><td class="num">${c.waiting}</td><td class="num">${c.highRisk ? `<span class="bad">${c.highRisk}</span>` : '0'}</td><td class="num">${hrs(c.oldestWaitingHours)}</td></tr>`).join('')}
      </tbody></table></div></div>
    </div>`;

    h += `<div class="srow">
      <div class="card"><h2>${t('일별 처리 추이', 'Daily trend')} <small>${t('결정(기둥) vs 심사 대기 진입(선), 최근 14일', 'decisions (columns) vs new arrivals (line), last 14 days')}</small></h2>${dailyChart(d.daily)}
        <div class="legend"><span><span class="sw" style="background:var(--good)"></span>${t('승인', 'approved')}</span><span><span class="sw" style="background:var(--critical)"></span>${t('거절', 'rejected')}</span><span><span class="sw" style="background:var(--text);height:2px;vertical-align:3px"></span>${t('심사 대기 진입', 'ready for review')}</span></div>
        <p class="sub" style="margin:8px 0 0">${t('선이 기둥보다 계속 높으면 대기 건이 쌓이고 있는 것입니다.', 'If the line stays above the columns, the backlog is growing.')}</p></div>
      <div class="card"><h2>${t('심사자별 현황', 'Per reviewer')} <small>${t('감사 이력 기준', 'from the audit trail')}</small></h2>${d.reviewers.length ? `<div class="scroll"><table><thead><tr><th>${t('심사자', 'Reviewer')}</th><th class="num">${t('승인', 'Approved')}</th><th class="num">${t('거절', 'Rejected')}</th><th class="num">${t('서류 재요청', 'Doc requests')}</th><th class="num">${t('딜러 재제출', 'Resubmissions')}</th><th class="num">${t('재평가', 'Re-assessed')}</th><th class="num">${t('메모', 'Notes')}</th><th class="num">${t('7일 결정', 'Decided 7 d')}</th><th>${t('최근 활동', 'Last activity')}</th></tr></thead><tbody>
        ${d.reviewers.map(r => `<tr><td><b>${esc(r.name)}</b></td><td class="num">${r.approved}</td><td class="num">${r.rejected}</td><td class="num">${r.documentsRequested}</td><td class="num">${r.resubmissionsRequested}</td><td class="num">${r.reassessments}</td><td class="num">${r.notes}</td><td class="num">${r.decisions7d}</td><td><span class="sub" title="${esc(fmtTime(r.lastActivityAt))}">${agoText(r.lastActivityAt)}</span></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="empty">${t('아직 심사자 이름으로 기록된 작업이 없습니다. 헤더에 심사자 이름을 입력하고 작업하면 여기에 집계됩니다.', 'No officer activity yet. Type a reviewer name in the header; actions are counted here.')}</p>`}</div>
    </div>`;

    const al = d.agentAlignment;
    h += `<div class="srow">
      <div class="card"><h2>${t('대기 중 Risk Flag', 'Risk flags in the queue')} <small>${t('지금 대기 중인 건의 Flag', 'flags on the applications waiting now')}</small></h2>${d.queueFlags.length ? hbars(d.queueFlags.slice(0, 10).map(f => ({ label: (f.fraud ? '⚠ ' : '') + L(f, 'title'), value: f.count, color: f.fraud ? 'var(--critical)' : 'var(--seq)', tip: `${L(f, 'title')} (${f.severity}): ${f.count}` })), { left: 200, aria: 'Flags in the queue' }) : `<p class="empty">${t('대기 중인 건에 Risk Flag가 없습니다.', 'No flags in the queue.')}</p>`}</div>
      <div class="card"><h2>${t('등급별 결정 결과', 'Decisions per AI grade')}</h2><div class="scroll"><table><thead><tr><th>${t('등급', 'Grade')}</th><th class="num">${t('결정', 'Decided')}</th><th class="num">${t('승인', 'Approved')}</th><th class="num">${t('거절', 'Rejected')}</th><th class="num">${t('승인율', 'Approval rate')}</th></tr></thead><tbody>
        ${d.gradeOutcomes.map(g => `<tr><td>${gradeCell(g.grade)}</td><td class="num">${g.decided}</td><td class="num">${g.approved}</td><td class="num">${g.rejected}</td><td class="num">${rate(g.approvalRate)}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>${t('AI 에이전트 판단 vs 심사 결과', 'Agent flag vs final decision')} <span class="sub">${t('"담당자 검토 필요" 표시와 최종 결정', '"officer review required" against the outcome')}</span></h3>
      <div class="scroll"><table><thead><tr><th>${t('에이전트 판단', 'Agent')}</th><th class="num">${t('결정', 'Decided')}</th><th class="num">${t('승인', 'Approved')}</th><th class="num">${t('거절', 'Rejected')}</th></tr></thead><tbody>
        <tr><td>${t('담당자 검토 필요', 'Flagged')}</td><td class="num">${al.flaggedDecided}</td><td class="num">${al.flaggedApproved}</td><td class="num">${al.flaggedRejected}</td></tr>
        <tr><td>${t('플래그 없음', 'Not flagged')}</td><td class="num">${al.notFlaggedDecided}</td><td class="num">${al.notFlaggedApproved}</td><td class="num">${al.notFlaggedRejected}</td></tr>
      </tbody></table></div>
      <p class="sub" style="margin:8px 0 0">${t('플래그된 건의 거절 비율이 높을수록 에이전트 판단이 심사 결과와 잘 맞는 것입니다. 스텁 모드에서는 플래그가 기록되지 않습니다.', "A high rejection share among flagged cases means the agent's flags are useful. Stub mode records no flags.")}</p></div>
    </div>`;

    h += `<p class="status">${t('생성 시각', 'Generated')} ${fmtTime(d.generatedAt)}${d.demoApplications ? ` · ${t(`데모 데이터 ${d.demoApplications}건 포함`, `includes ${d.demoApplications} demo applications`)}` : ''} · ${t(`${QUEUE_POLL_MS / 1000}초마다 갱신`, `refreshes every ${QUEUE_POLL_MS / 1000}s`)}</p>`;
    statsPanel.innerHTML = h;
    bindTips(statsPanel);
  }

  /* ---------- wiring ---------- */
  $('#load').addEventListener('click', () => { loadQueue(); loadDealers(); if (activeTab === 'stats') loadStats(); });
  $('#newapp').addEventListener('toggle', () => { if ($('#newapp').open) loadDealers(); });
  ['#f-scope', '#f-country', '#f-grade'].forEach(s => $(s).addEventListener('change', loadQueue));
  let tq; $('#f-q').addEventListener('input', () => { clearTimeout(tq); tq = setTimeout(loadQueue, 300); });
  // Language switch: redraw everything that was rendered from data; the static markup is swapped by lang.js itself.
  LANG.onChange(() => {
    if (queueLoaded) renderQueue();
    if (current) renderDetail(current);
    if (lastStats) renderStats(lastStats);
    if (reportNumber) showReport(reportNumber);
  });
  const wanted = new URLSearchParams(location.search).get('app');
  if (wanted) activeTab = 'work';
  showTab(activeTab);
  loadQueue().then(() => { if (wanted) open(wanted, true); }); if (activeTab === 'stats') loadStats();
  // Same cadence as the dashboard, so a new application shows up on both screens within the same quarter minute.
  setInterval(() => { if (activeTab === 'stats') loadStats(); else if (!document.activeElement.closest('#detail')) loadQueue(); }, QUEUE_POLL_MS);
})();
</script>
</body>
</html>
