<style>
  /* JB-style header: white bar, deep-blue top rule, monogram + group name */
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .brand .mark { flex: none; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -0.03em; display: grid; place-items: center; }
  .brand .group { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: .01em; line-height: 1.2; }
  .brand .group .svc { color: var(--text-3); font-weight: 500; margin-left: 6px; }
  footer { max-width: 1400px; margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; font-size: 12px; color: var(--text-3); }
  footer b { color: var(--brand); font-weight: 700; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  button:hover:not(:disabled) { border-color: var(--brand-3); color: var(--brand); }
  button.primary:hover:not(:disabled) { background: var(--brand-2); color: #fff; }
  button.approve:hover:not(:disabled), button.reject:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  ::selection { background: var(--brand-tint); }
  /* Page switch between the dashboard and the review page (no login: the demo back office is open) */
  .pages { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); margin-right: 12px; }
  .pages a { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .pages a:hover { color: var(--brand); }
  .pages a[aria-current="page"] { background: var(--brand); color: #fff; }
  @media (max-width: 700px) { .brand .mark { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; } h1 small { display: none; } }
  /* JB금융그룹 corporate palette: deep blue #0A31A8, accent #1C56FF, sky #00B2FF, navy #0D2D77, slate greys. */
  :root {
    color-scheme: light;
    --brand: #0a31a8; --brand-2: #1c56ff; --brand-3: #598aff; --brand-sky: #00b2ff; --brand-navy: #0d2d77; --brand-tint: #eaf0ff;
    --page: #f5f7fa; --surface: #ffffff; --surface-2: #f3f5f9; --border: #e1e5ee; --grid: #eceff5;
    --text: #1a1f2e; --text-2: #4a5464; --text-3: #728197;
    --c-id: #1c56ff; --c-mm: #f28c28; --c-kh: #17a673;                 /* categorical slots 1-3: Indonesia, Myanmar, Cambodia */
    --seq: var(--brand); --seq-light: #9bb6ff;                          /* sequential blue */
    --good: #0e9f6e; --warn: #f5b400; --serious: #ec7a3c; --critical: #d93025;
    --good-bg: #e6f7ef; --warn-bg: #fff6d9; --serious-bg: #fdebe0; --critical-bg: #fde8e7; --info-bg: var(--brand-tint);
    --shadow: 0 1px 2px rgba(13, 45, 119, .06), 0 4px 16px rgba(13, 45, 119, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #598aff; --brand-2: #7da2ff; --brand-3: #9bb6ff; --brand-navy: #0d2d77; --brand-tint: #1a2a5c;
      --page: #0b1226; --surface: #121a33; --surface-2: #1a2445; --border: #27325a; --grid: #222c4f;
      --text: #eef1f8; --text-2: #b7c0d9; --text-3: #8491b3;
      --c-id: #598aff; --c-mm: #f28c28; --c-kh: #2bb985;
      --seq: var(--brand); --seq-light: #2f4a9e;
      --good: #34c38f; --critical: #ef5350;
      --good-bg: #123a2c; --warn-bg: #3d3210; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #598aff; --brand-2: #7da2ff; --brand-3: #9bb6ff; --brand-navy: #0d2d77; --brand-tint: #1a2a5c;
    --page: #0b1226; --surface: #121a33; --surface-2: #1a2445; --border: #27325a; --grid: #222c4f;
    --text: #eef1f8; --text-2: #b7c0d9; --text-3: #8491b3;
    --c-id: #598aff; --c-mm: #f28c28; --c-kh: #2bb985;
    --seq: var(--brand); --seq-light: #2f4a9e;
    --good: #34c38f; --critical: #ef5350;
    --good-bg: #123a2c; --warn-bg: #3d3210; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "SUIT Variable", SUIT, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border-top: 4px solid var(--brand); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
  h2 small, .sub { font-size: 12px; font-weight: 400; color: var(--text-3); }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--text-2); }
  .key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .key input { border-radius: 999px; padding: 7px 12px; }
  input[type=password], input[type=text] { min-width: 160px; }
  textarea { width: 100%; min-height: 56px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--brand); color: #fff; border-color: transparent; }
  button.approve { background: var(--good); color: #fff; border-color: transparent; }
  button.reject { background: var(--critical); color: #fff; border-color: transparent; }
  .status { font-size: 12px; color: var(--text-3); }
  .status.err { color: var(--critical); }
  main { display: grid; gap: 20px; padding: 20px 24px 8px; max-width: 1400px; margin: 0 auto; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); }
  /* Two independent scroll areas on wide screens: the queue and the detail each scroll on their own, so the wheel over
     one never moves the other. Narrow screens keep the normal page scroll. */
  @media (min-width: 901px) {
    main { height: calc(100vh - var(--header-h, 80px) - var(--footer-h, 48px)); grid-template-rows: auto minmax(0, 1fr); overflow: hidden; padding-bottom: 0; }
    #queue, #detail, #stats { overflow-y: auto; min-height: 0; scrollbar-width: thin; overscroll-behavior: contain; }
    #detail { padding: 0 4px 20px; margin: 0 -4px; }
    footer { padding: 8px 24px 10px; }
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filters select, .filters input { flex: 1 1 100px; min-width: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--surface-2); }
  tr.row.selected { background: var(--info-bg); box-shadow: inset 3px 0 0 var(--brand); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); margin: 2px 4px 2px 0; color: var(--text-2); white-space: nowrap; }
  .chip.fraud { border-color: var(--critical); color: var(--critical); }
  .chip.badge { border-color: var(--good); color: var(--good); }
  .chip.warn { border-color: var(--warn); color: var(--text); background: var(--warn-bg); }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .pill.READY_FOR_REVIEW { background: var(--info-bg); color: var(--brand); }
  .pill.DOCUMENTS_REQUESTED, .pill.RESUBMISSION_REQUESTED { background: var(--warn-bg); color: var(--text); }
  .pill.APPROVED { background: var(--good-bg); color: var(--good); }
  .pill.REJECTED { background: var(--critical-bg); color: var(--critical); }
  .pill.DRAFT, .pill.SUBMITTED { background: var(--surface-2); color: var(--text-2); }
  .grade { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .grade .ic { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .gradebox { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border); }
  .gradebox .big { font-size: 26px; font-weight: 700; line-height: 1; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  /* Review agent summary inside the basic-information card */
  .summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .summary h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .summary h3 .sub { display: inline; font-weight: 400; }
  .summary pre { margin: 0; max-height: 260px; overflow: auto; }
  .kv dt { color: var(--text-3); } .kv dd { margin: 0; word-break: break-word; }
  .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .docs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .doc { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--surface-2); }
  .doc.superseded { opacity: .6; }
  .doc .img { width: 100%; aspect-ratio: 4/3; background: var(--grid); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in; color: var(--text-3); font-size: 12px; }
  .doc .img img { width: 100%; height: 100%; object-fit: contain; }
  .doc .meta { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .ok { color: var(--good); font-weight: 600; } .bad { color: var(--critical); font-weight: 600; } .mid { color: var(--serious); font-weight: 600; }
  .flag { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
  .flag .sev { font-size: 16px; line-height: 1; }
  .flag .t { font-weight: 600; } .flag .d { color: var(--text-2); font-size: 13px; }
  .actions { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .action { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .action h3 { margin-top: 0; }
  .action .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .action label { display: block; font-size: 12px; color: var(--text-2); margin: 6px 0 2px; }
  .action label.inline { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); padding: 10px; border-radius: 8px; font-size: 12px; max-height: 420px; overflow: auto; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .timeline time { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
  .empty { color: var(--text-3); font-size: 13px; padding: 12px 0; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
  .scroll { overflow-x: auto; }
  .notice { padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
  .notice.warn { background: var(--warn-bg); } .notice.crit { background: var(--critical-bg); color: var(--critical); } .notice.ok { background: var(--good-bg); color: var(--good); } .notice.info { background: var(--info-bg); }
  /* AI agent timeline */
  .flow { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; margin: 6px 0 12px; }
  .flow .step { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
  .flow .step.OK { border-color: var(--good); } .flow .step.FAIL { border-color: var(--critical); color: var(--critical); } .flow .step.WARN { border-color: var(--warn); } .flow .step.DECISION { border-color: var(--seq); color: var(--seq); font-weight: 600; }
  .flow .arrow { color: var(--text-3); font-size: 12px; padding: 0 2px; }
  .trace { list-style: none; margin: 0; padding: 0; position: relative; }
  .trace::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--grid); }
  .trace li { display: grid; grid-template-columns: 16px 88px 1fr; gap: 8px; padding: 6px 0; align-items: start; }
  .trace li.sep { grid-template-columns: 16px 1fr; color: var(--text-3); font-size: 12px; padding-top: 10px; }
  .trace .node { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); background: var(--text-3); margin-top: 2px; }
  .trace .node.DOCUMENT { background: var(--text-3); } .trace .node.ANALYSIS { background: var(--seq); } .trace .node.VALIDATION { background: var(--seq-light); }
  .trace .node.AGENT { background: #8b5cf6; } .trace .node.VERIFICATION { background: var(--c-kh); } .trace .node.RISK { background: var(--serious); }
  .trace .node.OUTCOME { background: var(--good); } .trace .node.OFFICER { background: var(--warn); }
  .trace time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; }
  .trace .body { min-width: 0; }
  .trace .head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .trace .kind { font-weight: 600; }
  .trace .st { font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
  .trace .st.OK { background: var(--good-bg); color: var(--good); } .trace .st.FAIL { background: var(--critical-bg); color: var(--critical); }
  .trace .st.WARN { background: var(--warn-bg); color: var(--text); } .trace .st.DECISION { background: var(--info-bg); color: var(--seq); } .trace .st.INFO { background: var(--surface-2); color: var(--text-2); }
  .trace .actor { font-size: 11px; color: var(--text-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .trace .actor.claude { border-color: #8b5cf6; color: #8b5cf6; }
  .trace .title { margin-top: 2px; }
  .trace .detail { color: var(--text-2); font-size: 13px; margin-top: 2px; white-space: pre-wrap; }
  .trace .meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .trace details { margin-top: 4px; } .trace pre { max-height: 220px; margin: 4px 0 0; }
  /* AI agent timeline folded under the onboarding stepper; closed by default, chevron toggles it */
  .trace-details { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 10px; }
  .trace-details > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; cursor: pointer; font-size: inherit; color: inherit; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; }
  .trace-details > summary::-webkit-details-marker { display: none; }
  .trace-details > summary:hover { background: var(--surface-2); }
  .trace-details > summary h2 { margin: 0; }
  .trace-details .chev { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--brand); font-size: 12px; line-height: 1; transition: transform .15s; }
  .trace-details[open] .chev { transform: rotate(90deg); }
  /* Evidence fold-out cards (documents, extracted data, lookups, risk flags): closed shows a one-line hint */
  .fold { margin-top: 16px; }
  .grid2 .fold { margin-top: 0; }
  .fold > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; cursor: pointer; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary:hover { background: var(--surface-2); }
  .fold > summary h2 { margin: 0; } .fold > summary h2 small { display: inline; margin-left: 6px; }
  .fold > summary .hint { display: inline; margin-left: auto; font-size: 12px; }
  .fold[open] > summary .hint { display: none; }
  .fold .chev { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--brand); font-size: 12px; line-height: 1; transition: transform .15s; flex: none; }
  .fold[open] .chev { transform: rotate(90deg); }
  .fold-body { margin-top: 10px; }
  .trace-details .hint::after { content: "펼치기"; } .trace-details[open] .hint::after { content: "접기"; }
  html[lang="en"] .trace-details .hint::after { content: "expand"; } html[lang="en"] .trace-details[open] .hint::after { content: "collapse"; }
  .trace-details .hint { margin-left: auto; }
  #trace-panel { margin-top: 10px; }
  #trace-card .trace-details { margin-top: 0; border-top: 0; padding-top: 0; }
  /* Onboarding progress pinned at the top of the detail: it sticks under the page header while the officer scrolls the
     evidence below, and once stuck it folds to its compact form (no stage notes or timestamps). */
  #stage-panel { position: sticky; top: calc(var(--header-h, 64px) + 8px); z-index: 4; transition: box-shadow .15s; }
  #stage-panel.stuck { box-shadow: 0 10px 28px rgba(13,45,119,.18); padding-top: 10px; padding-bottom: 10px; }
  #stage-panel.stuck .stepper .note, #stage-panel.stuck .stepper time, #stage-panel.stuck .stepper .lb small { display: none; }
  #stage-panel.stuck { border-radius: 10px; }
  #stage-sentinel { height: 1px; margin-bottom: -1px; }  /* a 1px marker above the card: scrolled out of view means the card is stuck */
  @media (min-width: 901px) { #stage-panel { top: 0; } }  /* inside the detail's own scroll area the card sticks to its top edge */
  #stage-panel.stuck::before { content: ""; position: absolute; left: -2px; right: -2px; top: -9px; height: 9px; background: var(--page); }  /* paints the gap to the header */
  /* Onboarding stage stepper (review detail) and the mini progress bar (queue rows, dashboard) */
  .stepper { list-style: none; margin: 8px 0 0; padding: 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }
  .stepper li { flex: 1 1 0; min-width: 96px; position: relative; padding: 0 6px 0 0; text-align: center; }
  .stepper li::before { content: ""; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--grid); }
  .stepper li.DONE::before, .stepper li.SKIPPED::before { background: var(--brand-3); }
  .stepper .dot { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); border: 2px solid var(--grid); color: var(--text-3); }
  .stepper .DONE .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper .SKIPPED .dot { background: var(--surface-2); border-color: var(--brand-3); color: var(--brand); }
  .stepper .CURRENT .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); animation: pulse 1.4s infinite; }
  .stepper .WARN .dot { background: var(--warn); border-color: var(--warn); color: #000; }
  .stepper .FAIL .dot { background: var(--critical); border-color: var(--critical); color: #fff; }
  .stepper .lb { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); line-height: 1.2; }
  .stepper .PENDING .lb { color: var(--text-3); font-weight: 500; }
  .stepper .CURRENT .lb { color: var(--brand); }
  .stepper .lb small { display: block; font-weight: 400; color: var(--text-3); font-size: 10px; }
  .stepper .note { display: block; font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.25; }
  .stepper .WARN .note { color: var(--serious); } .stepper .FAIL .note { color: var(--critical); }

        const why = statusChanged ? t(`상태가 ${statusName(tr.status)}(으)로 바뀌었습니다.`, `Status changed to ${statusName(tr.status)}.`) : t('새 결과가 도착했습니다.', 'New results arrived.');
        // Do not throw away what the officer is typing; reload once the focus leaves the detail pane.
        if (document.activeElement && document.activeElement.closest('#detail') && document.activeElement.matches('input, textarea, select')) {
          setStatus(why + ' ' + t('입력을 마치면 화면이 갱신됩니다.', 'The view refreshes when you finish typing.'));
          document.activeElement.addEventListener('blur', () => { if (current && current.applicationNumber === number) { open(number, true); loadQueue(); } }, { once: true });
          return;
        }
        await open(number, true); loadQueue(); return;
      }
      if (!tr.live) stopTracePolling();
    } catch (e) { /* keep polling; the next tick may succeed */ }
    finally { traceTickBusy = false; }
  }
  function startTracePolling(number) {
    stopTracePolling();
    tracePoll = setInterval(() => traceTick(number), TRACE_POLL_MS);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && current && tracePoll) traceTick(current.applicationNumber); });
  detail.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-sid]')) { const id = Number(d.dataset.sid); if (d.open) openSteps.add(id); else openSteps.delete(id); } else if (d.id === 'trace-details') traceOpen = d.open; else if (d.matches && d.matches('details.fold')) { if (d.open) foldOpen.add(d.dataset.fold); else foldOpen.delete(d.dataset.fold); try { localStorage.setItem('reviewFolds', JSON.stringify([...foldOpen])); } catch {} } }, true);

  try { const r = localStorage.getItem('reviewerName'); if (r) reviewerInput.value = r; } catch {}
  reviewerInput.addEventListener('change', () => { try { localStorage.setItem('reviewerName', reviewerInput.value.trim()); } catch {} });

  const headers = () => ({ 'Content-Type': 'application/json' });
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: headers() });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    return body;
  }
  function setStatus(msg, err) { status.textContent = msg; status.className = 'status' + (err ? ' err' : ''); }
  const errStatus = e => setStatus(t('오류: ', 'Error: ') + e.message, true);

  function showTip(e, text) { tip.textContent = text; tip.style.opacity = 1; moveTip(e); }
  function moveTip(e) { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
  function hideTip() { tip.style.opacity = 0; }
  function bindTips(root) { root.querySelectorAll('[data-tip]').forEach(el => { el.addEventListener('mouseenter', e => showTip(e, el.dataset.tip)); el.addEventListener('mousemove', moveTip); el.addEventListener('mouseleave', hideTip); }); }

  const gradeCell = (g, score) => { const m = GRADE[g]; return m ? `<span class="grade"><span class="ic" style="background:${m.color}"></span>${esc(g)} <span class="sub">${gradeName(g)}${score != null ? ' · ' + score : ''}</span></span>` : `<span class="sub">${t('미평가', 'not assessed')}</span>`; };
  const pill = s => `<span class="pill ${esc(s)}">${esc(statusName(s))}</span>`;
  const countryCell = c => `<span class="dot" style="background:${COUNTRY_COLOR[c] || 'var(--text-3)'}"></span>${esc(c)}`;

  /* ---------- queue ---------- */
  function queryString() {
    const scope = $('#f-scope').value, p = new URLSearchParams();
    if (scope === 'open') p.set('queue', 'true'); else if (scope !== 'all') p.set('status', scope);
    if ($('#f-country').value) p.set('country', $('#f-country').value);
    if ($('#f-grade').value) p.set('grade', $('#f-grade').value);
    if ($('#f-q').value.trim()) p.set('q', $('#f-q').value.trim());
    return p.toString();
  }
  async function loadQueue() {
    setStatus(t('불러오는 중…', 'Loading…'));
    try {
      apps = await api('/admin/applications?' + queryString());
      queueLoaded = true;
      renderQueue();
      setStatus(t('업데이트 ', 'Updated ') + nowClock());
    } catch (e) { errStatus(e); }
  }
  function renderQueue() {
    if (!apps.length) { list.innerHTML = `<p class="empty">${t('조건에 맞는 신청이 없습니다.', 'Nothing matches these filters.')}</p>`; $('#n-work').hidden = true; return; }
    list.innerHTML = `<div class="scroll"><table><thead><tr><th>${t('신청번호', 'Application')}</th><th>${t('상태', 'Status')}</th><th>${t('등급', 'Grade')}</th><th>${t('대기', 'Waiting')}</th></tr></thead><tbody>${apps.map(a => {
      const r = a.risk, waitingSince = a.risk?.assessedAt || a.verifiedAt || a.updatedAt;
      return `<tr class="row ${current && current.applicationNumber === a.applicationNumber ? 'selected' : ''}" data-n="${esc(a.applicationNumber)}">
        <td><b>${esc(a.applicationNumber)}</b><button type="button" class="rp-mini report-btn" data-n="${esc(a.applicationNumber)}" title="${t('고객 리포트 보기', 'Open the customer report')}">📄 ${t('리포트', 'Report')}</button><br><span class="sub">${countryCell(a.country)} · ${esc(a.dealerCode || '–')} · ${esc(customerName(a))}</span></td>
        <td>${pill(a.status)}${a.review?.officerReviewRequired ? `<br><span class="chip warn">${t('담당자 검토', 'Officer review')}</span>` : ''}${a.progress && a.status !== 'APPROVED' && a.status !== 'REJECTED' ? `<br><span style="white-space:nowrap">${miniBar(a.progress)} <span class="sub">${esc(curStage(a.progress))}</span></span>` : ''}</td>
        <td>${r ? gradeCell(r.grade, r.score) : '<span class="sub">–</span>'}${r && r.fraudWarnings ? `<br><span class="chip fraud">⚠ ${t('위조', 'fraud')} ${r.fraudWarnings}</span>` : ''}</td>
        <td class="num"><span class="sub" title="${esc(fmtTime(waitingSince))}">${a.status === 'READY_FOR_REVIEW' ? ago(waitingSince) : ago(a.updatedAt)}</span></td></tr>`; }).join('')}</tbody></table></div>
      <p class="sub" style="margin:8px 0 0">${t(`${apps.length}건 · 심사 대기 우선, 리스크 점수 높은 순 · ${QUEUE_POLL_MS / 1000}초마다 갱신`, `${apps.length} applications · ready-for-review first, highest risk score first · refreshes every ${QUEUE_POLL_MS / 1000}s`)}</p>`;
    const waitingCount = apps.filter(a => a.status === 'READY_FOR_REVIEW').length; $('#n-work').textContent = waitingCount; $('#n-work').hidden = !waitingCount;
    list.querySelectorAll('tr.row').forEach(tr => tr.addEventListener('click', () => open(tr.dataset.n)));
    list.querySelectorAll('button.report-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); showReport(b.dataset.n); }));
  }

  /* ---------- detail ---------- */
  async function open(number, keepScroll) {
    if (!keepScroll) history.replaceState(null, '', '/review?app=' + encodeURIComponent(number));
    try {
      const a = await api('/admin/applications/' + encodeURIComponent(number));
      const changed = !current || current.applicationNumber !== a.applicationNumber;
      if (changed) traceLastId = Infinity;   // new application: nothing counts as "just arrived"
      current = a;
      renderDetail(a);
      if (changed) detail.scrollTop = 0;     // the detail has its own scroll area on wide screens: start a new application at its top
      renderQueue();
    } catch (e) { errStatus(e); }
  }

  function renderDetail(a) {
    const r = a.risk, final = a.status === 'APPROVED' || a.status === 'REJECTED';
    const docs = a.documents || [], live = docs.filter(d => !d.superseded), old = docs.filter(d => d.superseded);
    const noPhone = final || !a.customerPhone;
    // onboarding stage stepper first, pinned under the page header while the rest scrolls; kept fresh by the trace poll
    let h = `<div id="stage-sentinel"></div><div class="card" id="stage-panel"><div id="stage-body">${renderStages(a.progress)}</div></div>`;
    h += `<div class="card" style="margin-top:16px">
      <div style="display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between">
        <div>
          <h2 style="font-size:20px">${esc(a.applicationNumber)} ${pill(a.status)}</h2>
          <div class="sub">${countryCell(a.country)} ${esc(countryName(a.country))} · ${t('딜러', 'dealer')} ${esc(a.dealerCode || '–')} ${esc(a.dealerName || '')}${a.dealerTier === 'EXCELLENT' ? ' ★' : ''} · ${t('생성', 'created')} ${fmtTime(a.createdAt)} · ${t('최근', 'updated')} ${fmtTime(a.updatedAt)}</div>
          <div style="margin-top:6px"><b>${esc(customerName(a))}</b> ${a.customerPhone ? `<span class="sub">+${esc(a.customerPhone)}</span>` : `<span class="sub">${t('(START 링크를 아직 열지 않음)', '(START link not opened yet)')}</span>`}</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          ${r ? `<div class="gradebox" style="border-color:${(GRADE[r.grade] || { color: 'var(--text-3)' }).color}"><span class="big" style="color:${(GRADE[r.grade] || { color: 'var(--text-3)' }).color}">${esc(r.grade)}</span><div><div><b>${esc(L(r, 'gradeLabel'))}</b></div><div class="sub">${t('점수', 'score')} ${r.score} / 100 · ${r.fraudWarnings ? `<span class="bad">⚠ ${t('위조·사기 경고', 'fraud / forgery warnings')} ${r.fraudWarnings}</span>` : t('위조 신호 없음', 'no fraud signal')}</div><div class="sub">${esc(methodName(r.method))} · ${fmtTime(r.assessedAt)}</div></div></div>` : `<span class="sub">${t('리스크 미평가 (서류 미완료)', 'Not assessed yet (documents incomplete)')}</span>`}
        </div>
      </div>
      <div style="margin-top:8px">${(r?.badges || []).map(b => `<span class="chip badge" data-tip="${esc(b.description)}">✓ ${esc(L(b))}</span>`).join('')}${a.review?.officerReviewRequired ? `<span class="chip warn" data-tip="${t('자동 분석이 일부 데이터를 확신하지 못했습니다. 이미지와 대조해 주세요.', 'The automatic analysis was not confident about some fields. Compare with the images.')}">${t('담당자 검토 필요', 'Officer review required')}</span>` : ''}${a.linkOutstanding ? `<span class="chip">${t('딜러 폼 링크 유효', 'Dealer form link active')}</span>` : ''}</div>
      ${final ? `<div class="notice ${a.status === 'APPROVED' ? 'ok' : 'crit'}" style="margin-top:10px"><b>${esc(statusName(a.status))}</b> · ${fmtTime(a.decidedAt || a.updatedAt)}${a.decidedBy ? ' · ' + esc(a.decidedBy) : ''}${a.decisionNote ? '<br>' + esc(a.decisionNote) : ''}</div>` : ''}
      ${a.status === 'DOCUMENTS_REQUESTED' || a.status === 'RESUBMISSION_REQUESTED' ? `<div class="notice warn" style="margin-top:10px">${a.status === 'DOCUMENTS_REQUESTED' ? t('고객에게 서류를 다시 요청한 상태입니다. 새 사진이 접수되면 검사·조회가 다시 실행되고 심사 대기로 돌아옵니다.', 'The customer has been asked to resend documents. When new photos arrive, the checks and lookups run again and the application returns to the queue.') : t('딜러에게 폼 재제출을 요청한 상태입니다.', 'The dealer has been asked to resubmit the form.')}${a.resubmissionReason ? '<br><span class="sub">' + esc(a.resubmissionReason) + '</span>' : ''}</div>` : ''}
      ${a.review ? `<div class="summary"><h3>${t('자동 리뷰 요약', 'Review agent summary')} <span class="sub">${esc(a.review.decision || '')} · ${t('라운드', 'rounds')} ${a.review.rounds}${a.review.reviewedAt ? ' · ' + fmtTime(a.review.reviewedAt) : ''}</span></h3>${summaryOf(a.review) ? `<pre>${esc(summaryOf(a.review))}</pre>` : `<p class="empty" style="padding:4px 0">${t('요약이 아직 없습니다.', 'No summary yet.')}</p>`}</div>` : ''}
    </div>`;

    // evidence panels, folded: documents, extracted data and lookups, risk flags. The officer's open/closed choice is remembered.
    h += fold('docs', `${t('서류', 'Documents')} <small>${t(`현재 ${live.length}건${old.length ? ', 이전 제출본 ' + old.length + '건' : ''}`, `${live.length} current${old.length ? ', ' + old.length + ' superseded' : ''}`)}</small>`, '');
    h += `<div class="fold-body">`;
    h += live.length ? `<div class="docs">${live.map(docCard).join('')}</div>` : `<p class="empty">${t('아직 접수된 서류가 없습니다.', 'No documents received yet.')}</p>`;
    if (old.length) h += `<details style="margin-top:10px"><summary>${t(`이전 제출본 ${old.length}건 보기`, `Show ${old.length} superseded upload(s)`)}</summary><div class="docs" style="margin-top:10px">${old.map(docCard).join('')}</div></details>`;

    // extracted + providers
