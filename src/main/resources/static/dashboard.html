<script src="/lang.js"></script>
<style>
  /* JB-style header: white bar, deep-blue top rule, monogram + group name */
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .brand .mark { flex: none; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -0.03em; display: grid; place-items: center; }
  .brand .group { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: .01em; line-height: 1.2; }
  .brand .group .svc { color: var(--text-3); font-weight: 500; margin-left: 6px; }
  footer { max-width: 1400px; margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; font-size: 12px; color: var(--text-3); }
  footer b { color: var(--brand); font-weight: 700; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  button:hover:not(:disabled) { border-color: var(--brand-3); color: var(--brand); }
  button.primary:hover:not(:disabled) { background: var(--brand-2); color: #fff; }
  button.approve:hover:not(:disabled), button.reject:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  ::selection { background: var(--brand-tint); }
  /* Page switch between the dashboard and the review page (the admin key is shared through session storage) */
  .pages { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); margin-right: 12px; }
  .pages a { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .pages a:hover { color: var(--brand); }
  .pages a[aria-current="page"] { background: var(--brand); color: #fff; }
  @media (max-width: 700px) { .brand .mark { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; } h1 small { display: none; } }
  /* JB금융그룹 corporate palette: deep blue #0A31A8, accent #1C56FF, sky #00B2FF, navy #0D2D77, slate greys. */
  :root {
    color-scheme: light;
    --brand: #0a31a8; --brand-2: #1c56ff; --brand-3: #598aff; --brand-sky: #00b2ff; --brand-navy: #0d2d77; --brand-tint: #eaf0ff;
    --page: #f5f7fa; --surface: #ffffff; --surface-2: #f3f5f9; --border: #e1e5ee; --grid: #eceff5;
    --text: #1a1f2e; --text-2: #4a5464; --text-3: #728197;
    --c-id: #1c56ff; --c-mm: #f28c28; --c-kh: #17a673;                 /* categorical slots 1-3: Indonesia, Myanmar, Cambodia */
    --seq: var(--brand); --seq-light: #9bb6ff;                          /* sequential blue */
    --good: #0e9f6e; --warn: #f5b400; --serious: #ec7a3c; --critical: #d93025;
    --good-bg: #e6f7ef; --warn-bg: #fff6d9; --serious-bg: #fdebe0; --critical-bg: #fde8e7; --info-bg: var(--brand-tint);
    --shadow: 0 1px 2px rgba(13, 45, 119, .06), 0 4px 16px rgba(13, 45, 119, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #598aff; --brand-2: #7da2ff; --brand-3: #9bb6ff; --brand-navy: #0d2d77; --brand-tint: #1a2a5c;
      --page: #0b1226; --surface: #121a33; --surface-2: #1a2445; --border: #27325a; --grid: #222c4f;
      --text: #eef1f8; --text-2: #b7c0d9; --text-3: #8491b3;
      --c-id: #598aff; --c-mm: #f28c28; --c-kh: #2bb985;
      --seq: var(--brand); --seq-light: #2f4a9e;
      --good: #34c38f; --critical: #ef5350;
      --good-bg: #123a2c; --warn-bg: #3d3210; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #598aff; --brand-2: #7da2ff; --brand-3: #9bb6ff; --brand-navy: #0d2d77; --brand-tint: #1a2a5c;
    --page: #0b1226; --surface: #121a33; --surface-2: #1a2445; --border: #27325a; --grid: #222c4f;
    --text: #eef1f8; --text-2: #b7c0d9; --text-3: #8491b3;
    --c-id: #598aff; --c-mm: #f28c28; --c-kh: #2bb985;
    --seq: var(--brand); --seq-light: #2f4a9e;
    --good: #34c38f; --critical: #ef5350;
    --good-bg: #123a2c; --warn-bg: #3d3210; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "SUIT Variable", SUIT, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border-top: 4px solid var(--brand); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
  h2 small, .sub { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
  main { padding: 20px 24px 8px; display: grid; gap: 20px; max-width: 1200px; margin: 0 auto; }
  .row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .k small { color: var(--text-3); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--brand); font-variant-numeric: tabular-nums; }
  .tile.alert .v { color: var(--critical); }
  .tile.good .v { color: var(--good); }
  #panel-dealers th { white-space: nowrap; }
  .action { border: 1px solid var(--border); border-radius: 12px; }
  .chip.fraud { border-color: var(--critical); color: var(--critical); }
  .notice { padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
  .notice.ok { background: var(--good-bg); color: var(--good); }
  @media (max-width: 760px) { .netgrid { grid-template-columns: 1fr !important; } }
  .key { display: flex; gap: 8px; align-items: center; }
  input[type=password], input[type=text] { font: inherit; padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); min-width: 220px; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button.primary { background: var(--brand); color: #fff; border-color: transparent; }
  /* Onboarding stage stepper (review detail) and the mini progress bar (queue rows, dashboard) */
  .stepper { list-style: none; margin: 8px 0 0; padding: 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }
  .stepper li { flex: 1 1 0; min-width: 96px; position: relative; padding: 0 6px 0 0; text-align: center; }
  .stepper li::before { content: ""; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--grid); }
  .stepper li.DONE::before, .stepper li.SKIPPED::before { background: var(--brand-3); }
  .stepper .dot { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); border: 2px solid var(--grid); color: var(--text-3); }
  .stepper .DONE .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper .SKIPPED .dot { background: var(--surface-2); border-color: var(--brand-3); color: var(--brand); }
  .stepper .CURRENT .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); animation: pulse 1.4s infinite; }
  .stepper .WARN .dot { background: var(--warn); border-color: var(--warn); color: #000; }
  .stepper .FAIL .dot { background: var(--critical); border-color: var(--critical); color: #fff; }
  .stepper .lb { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); line-height: 1.2; }
  .stepper .PENDING .lb { color: var(--text-3); font-weight: 500; }
  .stepper .CURRENT .lb { color: var(--brand); }
  .stepper .lb small { display: block; font-weight: 400; color: var(--text-3); font-size: 10px; }
  .stepper .note { display: block; font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.25; }
  .stepper .WARN .note { color: var(--serious); } .stepper .FAIL .note { color: var(--critical); }
  .stepper time { display: block; font-size: 10px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .progress-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .progress-head .pct { font-size: 20px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
  .mini { display: inline-block; width: 64px; height: 6px; border-radius: 999px; background: var(--grid); vertical-align: middle; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .mini.warn i { background: var(--warn); } .mini.done i { background: var(--good); }
  .segbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--grid); margin: 10px 0 8px; }
  .segbar i { display: block; height: 100%; min-width: 2px; }
  .stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .stages .s { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--brand-3); }
  .stages .s .n { font-size: 20px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stages .s .k { font-size: 11px; color: var(--text-2); font-weight: 600; } .stages .s .k small { display: block; color: var(--text-3); font-weight: 400; }
  .stages .s.zero .n { color: var(--text-3); } .stages .s.zero { border-left-color: var(--grid); }
  .dots { display: inline-flex; gap: 2px; vertical-align: middle; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
  .dots i.DONE, .dots i.SKIPPED { background: var(--brand); } .dots i.CURRENT { background: var(--brand-3); box-shadow: 0 0 0 2px var(--brand-tint); }
  .dots i.WARN { background: var(--warn); } .dots i.FAIL { background: var(--critical); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 82px 16px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: start; }
  .feed time { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .feed .node { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--text-3); }
  .feed .node.ANALYSIS { background: var(--brand); } .feed .node.VALIDATION { background: var(--brand-3); } .feed .node.AGENT { background: #8b5cf6; }
  .feed .node.VERIFICATION { background: var(--c-kh); } .feed .node.RISK { background: var(--serious); } .feed .node.OUTCOME { background: var(--good); } .feed .node.OFFICER { background: var(--warn); }
  .feed .st { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); margin-left: 4px; }
  .feed .st.OK { color: var(--good); } .feed .st.FAIL { color: var(--critical); } .feed .st.WARN { color: var(--serious); } .feed .st.DECISION { color: var(--brand); }
  .feed .t { color: var(--text-2); font-size: 12px; }
  .feed li.new { animation: arrive 3s ease-out; }
  @keyframes arrive { 0%, 70% { background: var(--info-bg); } 100% { background: transparent; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .45; } 100% { opacity: 1; } }
  .auto { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .auto .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 1.4s infinite; }
  .status { font-size: 12px; color: var(--text-3); }
  .status.err { color: var(--critical); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-2); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); margin: 2px 4px 2px 0; color: var(--text-2); white-space: nowrap; }
  .chip.fraud { border-color: var(--critical); color: var(--critical); }
  .chip.badge { border-color: var(--good); color: var(--good); }
  .grade { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .grade .ic { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin-top: 8px; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { fill: var(--text-2); font-size: 11px; }
  svg .lbl { fill: var(--text); font-size: 11px; }
  svg .grid { stroke: var(--grid); stroke-width: 1; }
  .bar { cursor: default; }
  .fraudnet .netnode { cursor: grab; } .fraudnet .netnode.dragging { cursor: grabbing; }
  .netreset { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  .bar:hover { filter: brightness(0.9); }
  #tip { position: fixed; pointer-events: none; background: var(--brand-navy); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 10; max-width: 260px; }
  .empty { color: var(--text-3); font-size: 13px; padding: 12px 0; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 12px; }
  .scroll { overflow-x: auto; }
  a.app { color: var(--brand); text-decoration: none; font-weight: 600; }
  a.app:hover { text-decoration: underline; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600; background: var(--surface-2); color: var(--text-2); }
  .pill.READY_FOR_REVIEW { background: var(--info-bg); color: var(--brand); }
  .pill.DOCUMENTS_REQUESTED, .pill.RESUBMISSION_REQUESTED { background: var(--warn); color: #000; }
  .pill.APPROVED { background: var(--good); color: #fff; } .pill.REJECTED { background: var(--critical); color: #fff; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; margin-bottom: -4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; font-weight: 500; padding: 8px 12px 10px; color: var(--text-2); white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
  .tabs button small { font-size: 11px; color: var(--text-3); }
  .tabs button:hover { color: var(--brand); background: var(--brand-tint); border-radius: 8px 8px 0 0; }
  .tabs button[aria-selected="true"] { color: var(--brand); font-weight: 700; border-bottom-color: var(--brand); }
  .tabs button .n { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); align-self: center; }
  .tabs button[aria-selected="true"] .n { background: var(--brand); color: #fff; }
  .panel { display: grid; gap: 16px; }
  .panel[hidden] { display: none; }
  textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); width: 100%; min-height: 56px; resize: vertical; }
  /* Dashboard copilot: chat about the portfolio figures this page shows */
  .copilot h2 .mode { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--brand-tint); color: var(--brand); vertical-align: middle; margin-left: 6px; }
  .copilot h2 .mode.rules { background: var(--surface-2); color: var(--text-2); }
  .copilot .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .copilot .chips button { font-size: 12px; font-weight: 500; padding: 5px 11px; background: var(--surface); }
  .copilot .log { display: grid; gap: 8px; max-height: 480px; overflow-y: auto; padding: 2px 2px 6px; }
  .copilot .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; white-space: normal; }
  .copilot .msg.user { background: var(--brand); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .copilot .msg.ai { background: var(--surface-2); border-bottom-left-radius: 4px; }
  .copilot .msg.ai.err { background: var(--critical-bg); color: var(--critical); }
  .copilot .msg p { margin: 0 0 6px; } .copilot .msg p:last-child { margin-bottom: 0; }
  .copilot .msg ul { margin: 4px 0; padding-left: 18px; } .copilot .msg li { margin: 2px 0; }
  .copilot .msg code { font-size: 12px; background: rgba(127,127,127,.15); padding: 0 4px; border-radius: 4px; }
  .copilot .msg .meta { display: block; font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .copilot .msg.user .meta { color: rgba(255,255,255,.75); }
  .copilot .thinking { display: inline-flex; gap: 4px; align-items: center; color: var(--text-3); font-size: 13px; }
  .copilot .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-3); animation: pulse 1s infinite; }
  .copilot .thinking i:nth-child(2) { animation-delay: .2s; } .copilot .thinking i:nth-child(3) { animation-delay: .4s; }
  .copilot .ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; align-items: end; }
  .copilot .ask textarea { min-height: 42px; max-height: 140px; border-radius: 12px; }
  .copilot .foot { font-size: 11px; color: var(--text-3); margin-top: 6px; }
  /* Standard dialog (excellent dealer criteria) */
  dialog.standard { border: 1px solid var(--border); border-radius: 18px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--text); box-shadow: 0 24px 64px rgba(13,45,119,.28); }
  dialog.standard::backdrop { background: rgba(13,45,119,.35); backdrop-filter: blur(2px); }
  dialog.standard .inner { padding: 20px 22px 18px; overflow-y: auto; max-height: calc(100vh - 48px); }
  dialog.standard .head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
  dialog.standard h2 { font-size: 17px; margin: 0; }
  dialog.standard h3 { font-size: 13px; margin: 16px 0 6px; color: var(--brand); }
  dialog.standard p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
  dialog.standard th, dialog.standard td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
  dialog.standard td.th { font-weight: 600; white-space: nowrap; }
  dialog.standard ul { margin: 4px 0; padding-left: 18px; font-size: 13px; } dialog.standard li { margin: 3px 0; }
  dialog.standard .close { flex: none; width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }
  .btn-standard::before { content: '📋'; margin-right: 6px; }
  .copilot .msg.ai .caret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--brand-3); animation: pulse .8s infinite; border-radius: 2px; }
  @media (max-width: 600px) { main, header, footer { padding-left: 16px; padding-right: 16px; } .tile .v { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark" aria-hidden="true">JB</span>

<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const { t, L } = LANG;                        // t(ko, en) picks the current language; L(obj) picks label / labelKo
  const main = $('#main'), status = $('#status'), keyInput = $('#key'), tip = $('#tip');
  const COUNTRY_COLOR = { ID: 'var(--c-id)', MM: 'var(--c-mm)', KH: 'var(--c-kh)' };
  const GRADE = {
    A: { color: 'var(--good)', icon: '●', ko: '저위험', en: 'Low' },
    B: { color: 'var(--warn)', icon: '▲', ko: '중위험', en: 'Medium' },
    C: { color: 'var(--serious)', icon: '◆', ko: '고위험', en: 'High' },
    D: { color: 'var(--critical)', icon: '■', ko: '위험 고객', en: 'Critical' },
  };
  const STATUS = { DRAFT: ['작성 중', 'Draft'], SUBMITTED: ['폼 제출됨', 'Form submitted'], RESUBMISSION_REQUESTED: ['폼 재제출 요청', 'Form resubmission requested'], READY_FOR_REVIEW: ['심사 대기', 'Ready for review'], DOCUMENTS_REQUESTED: ['고객 서류 재요청', 'Documents requested'], APPROVED: ['승인', 'Approved'], REJECTED: ['거절', 'Rejected'] };
  const statusName = s => { const m = STATUS[s]; return m ? t(m[0], m[1]) : s; };
  const appLink = n => `<a class="app" href="/review?app=${encodeURIComponent(n)}" title="${t('심사 화면에서 열기', 'Open in the review page')}">${esc(n)}</a>`;
  const pill = s => `<span class="pill ${esc(s)}">${esc(statusName(s))}</span>`;
  const hrs = h => h == null ? '–' : h < 1 ? Math.round(h * 60) + t('분', 'm') : h < 48 ? h.toFixed(1) + 'h' : (h / 24).toFixed(1) + 'd';
  const agoText = h => h == null ? '–' : t(hrs(h) + ' 전', hrs(h) + ' ago');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
  const num = v => v == null ? '–' : (Number.isInteger(v) ? v : v.toFixed(0));
  const fmtTime = iso => { try { return new Date(iso).toLocaleString(LANG.locale, { hour12: false }); } catch { return iso; } };
  const fmtShort = iso => { try { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; } catch { return iso; } };
  let pipelineStages = [];   // stage code -> labels, from the last payload (progress rows carry only the code and the Korean label)
  const curStage = r => LANG.lang === 'en' ? (pipelineStages.find(s => s.code === r.current)?.label || r.current) : r.currentKo;
  const noteOf = r => (LANG.lang === 'en' ? (r.noteEn ?? r.note) : r.note) || '';
  const STAGE_COLORS = ['#9bb6ff', '#7da2ff', '#598aff', '#3b6ef0', '#1c56ff', '#1446d6', '#0a31a8', '#0d2d77', '#17a673'];
  const AUTO_MS = 15000;
  let seenStepKeys = null;   // activity-feed keys already shown, to highlight what is new on each refresh
  let lastData = null;       // last payload, redrawn as is when the language changes
  let lastNetwork = null;    // fraud network, loaded alongside the stats
  const netPinned = new Map(); // fraud-network nodes the user dragged: id → {x, y}; kept across refreshes and page loads in this tab
  try { for (const [k, v] of Object.entries(JSON.parse(sessionStorage.getItem('fraudNetPins') || '{}'))) netPinned.set(k, v); } catch {}
  function saveNetPins() { try { sessionStorage.setItem('fraudNetPins', JSON.stringify(Object.fromEntries(netPinned))); } catch {} }

  try { const k = sessionStorage.getItem('adminKey'); if (k) keyInput.value = k; } catch {}

  function showTip(e, text) { tip.textContent = text; tip.style.opacity = 1; moveTip(e); }
  function moveTip(e) { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
  function hideTip() { tip.style.opacity = 0; }
  function bindTips(root) {
    root.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mouseenter', e => showTip(e, el.dataset.tip));
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', hideTip);
    });
  }

  /* Fraud network: a node can be dragged. Its lines follow while dragging, the place is remembered (netPinned) so the
     next refresh keeps it, and the moved node stays fixed while the layout settles the others around it. A plain click
     on a circle still opens the review page: a click right after a drag is swallowed. */
  function bindNetworkDrag(root) {
    const svg = root.querySelector('svg.fraudnet'); if (!svg) return;
    const W = +svg.dataset.w, H = +svg.dataset.h;
    const toSvg = e => { const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: pt.x, y: pt.y }; };
    const lines = [...svg.querySelectorAll('line[data-src]')];
    const place = (g, id, x, y) => {
      g.setAttribute('transform', `translate(${(x - +g.dataset.x).toFixed(1)} ${(y - +g.dataset.y).toFixed(1)})`);
      for (const l of lines) {
        if (l.dataset.src === id) { l.setAttribute('x1', x.toFixed(1)); l.setAttribute('y1', y.toFixed(1)); }
        if (l.dataset.dst === id) { l.setAttribute('x2', x.toFixed(1)); l.setAttribute('y2', y.toFixed(1)); }
      }
    };
    let drag = null, justDragged = false;
    svg.addEventListener('pointerdown', e => {
      const g = e.target.closest('.netnode'); if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const id = g.dataset.node, cur = netPinned.get(id) || { x: +g.dataset.x, y: +g.dataset.y }, p = toSvg(e);
      drag = { g, id, dx: cur.x - p.x, dy: cur.y - p.y, x: cur.x, y: cur.y, moved: false, sx: e.clientX, sy: e.clientY };
      justDragged = false;
      try { g.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
    });
    svg.addEventListener('pointermove', e => {
      if (!drag) return;
      if (!drag.moved) { if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 3) return; drag.moved = true; drag.g.classList.add('dragging'); hideTip(); }
      const p = toSvg(e);
      drag.x = Math.max(16, Math.min(W - 16, p.x + drag.dx)); drag.y = Math.max(12, Math.min(H - 26, p.y + drag.dy));
      place(drag.g, drag.id, drag.x, drag.y);
    });
    const end = () => {
      if (!drag) return;
      drag.g.classList.remove('dragging');
      if (drag.moved) { netPinned.set(drag.id, { x: drag.x, y: drag.y }); saveNetPins(); root.querySelector('.netreset')?.removeAttribute('hidden'); justDragged = true; setTimeout(() => { justDragged = false; }, 0); }
      drag = null;
    };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('click', e => { if (justDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
    root.querySelector('.netreset')?.addEventListener('click', () => { netPinned.clear(); saveNetPins(); if (lastData) render(lastData); });
  }

  /* Horizontal bar chart: rows = [{label, value, color, tip}] ; one axis, thin marks, rounded data-end, gaps between bars. */
  function hbars(rows, opts = {}) {
    const W = 520, rowH = 26, left = opts.left || 120, right = 44, top = 4;
    const H = top + rows.length * rowH + 4;
    const max = Math.max(1, ...rows.map(r => r.value));
    const scale = v => (W - left - right) * v / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">`;
    [0.25, 0.5, 0.75, 1].forEach(f => { const x = left + scale(max * f); s += `<line class="grid" x1="${x}" x2="${x}" y1="${top}" y2="${H - 4}"/>`; });
    rows.forEach((r, i) => {
      const y = top + i * rowH + 5, h = rowH - 10, w = Math.max(r.value > 0 ? 4 : 0, scale(r.value));
      s += `<text x="${left - 8}" y="${y + h / 2 + 4}" text-anchor="end" class="lbl">${esc(r.label)}</text>`;
      if (w > 0) s += `<path class="bar" data-tip="${esc(r.tip || r.label + ': ' + r.value)}" d="M${left},${y} h${w - 4} a4,4 0 0 1 4,4 v${h - 8} a4,4 0 0 1 -4,4 h-${w - 4} z" fill="${r.color}"/>`;
      s += `<text x="${left + w + 6}" y="${y + h / 2 + 4}">${r.value}</text>`;
    });
    return s + '</svg>';
  }

  /* Grouped bars per country for one measure set: groups = countries, series = statuses (sequential steps of one hue). */
  function countryStacked(byCountry) {
    const series = [
      { key: 'inProgress', label: t('진행 중', 'In progress'), color: 'var(--seq-light)' },
      { key: 'readyForReview', label: t('심사 대기', 'Ready for review'), color: 'var(--seq)' },
      { key: 'approved', label: t('승인', 'Approved'), color: 'var(--good)' },
      { key: 'rejected', label: t('거절', 'Rejected'), color: 'var(--critical)' },
    ];
    const W = 520, rowH = 34, left = 110, right = 40, top = 4, H = top + byCountry.length * rowH + 4;
    const max = Math.max(1, ...byCountry.map(c => c.applications));
    const scale = v => (W - left - right) * v / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications by country and status">`;
    byCountry.forEach((c, i) => {
      const y = top + i * rowH + 7, h = rowH - 14;
      s += `<text x="${left - 8}" y="${y + h / 2 + 4}" text-anchor="end" class="lbl">${esc(L(c, 'name'))} ${esc(c.code)}</text>`;
      let x = left;
      series.forEach(sr => {
        const v = c[sr.key]; if (!v) return;
        const w = Math.max(3, scale(v)) - 2;
        s += `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${sr.color}" data-tip="${esc(L(c, 'name') + ' · ' + sr.label + ': ' + v)}"/>`;
        x += w + 2;
      });
      s += `<text x="${x + 6}" y="${y + h / 2 + 4}">${c.applications}</text>`;
    });
    s += '</svg><div class="legend">' + series.map(sr => `<span><span class="dot" style="background:${sr.color}"></span>${sr.label}</span>`).join('') + '</div>';
    return s;
  }

  /* Weekly columns stacked by country (categorical), with the high-risk count as a dark marker above each week. */
  function trendChart(weeks) {
    const W = 520, H = 170, left = 36, right = 8, top = 22, bottom = 26, n = weeks.length;
    const max = Math.max(1, ...weeks.map(w => w.created));
    const plotW = W - left - right, plotH = H - top - bottom, colW = plotW / n, barW = Math.min(34, colW * 0.6);
    const y = v => top + plotH - plotH * v / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per week by country">`;
    [0, 0.5, 1].forEach(f => { const yy = y(max * f); s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${yy}" y2="${yy}"/><text x="${left - 6}" y="${yy + 4}" text-anchor="end">${Math.round(max * f)}</text>`; });
    weeks.forEach((w, i) => {
      const cx = left + colW * i + colW / 2, x = cx - barW / 2;
      let acc = 0;
      ['ID', 'MM', 'KH'].forEach(c => {
        const v = w.createdByCountry[c] || 0; if (!v) return;
        const y1 = y(acc + v), h = y(acc) - y1;
        s += `<rect class="bar" x="${x}" y="${y1}" width="${barW}" height="${Math.max(h - 1, 1)}" rx="2" fill="${COUNTRY_COLOR[c]}" data-tip="${esc(t(`${w.label} 주 · ${c}: ${v}건 신청`, `week ${w.label} · ${c}: ${v} applications`))}"/>`;
        acc += v;
      });
      if (w.created) s += `<text x="${cx}" y="${y(acc) - 4}" text-anchor="middle">${w.created}</text>`;
      if (w.highRisk) s += `<text x="${cx}" y="${top - 8}" text-anchor="middle" fill="var(--critical)" style="fill:var(--critical);font-weight:600" data-tip="${esc(t(`${w.label} 주 · 고위험 ${w.highRisk}건, 위조 경고 ${w.fraudWarnings}건`, `week ${w.label} · ${w.highRisk} high-risk, ${w.fraudWarnings} fraud warnings`))}">⚠${w.highRisk}</text>`;
      s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="lbl">${esc(w.label)}</text>`;
    });
    s += `</svg><div class="legend">${['ID', 'MM', 'KH'].map(c => `<span><span class="dot" style="background:${COUNTRY_COLOR[c]}"></span>${c}</span>`).join('')}<span><span style="color:var(--critical);font-weight:600">⚠n</span> ${t('그 주에 서류가 완료된 고위험(C·D) 건수', 'high-risk (C·D) applications completed that week')}</span></div>`;
    return s;
  }

  /* Weekly columns per dealer tier, side by side: excellent dealers in the brand blue, standard dealers in the light step. */
  function tierTrendChart(weeks) {
    const W = 520, H = 170, left = 36, right = 8, top = 16, bottom = 26, n = weeks.length;
    const TIERS = [['EXCELLENT', t('우수 딜러', 'Excellent'), 'var(--seq)'], ['STANDARD', t('일반 딜러', 'Standard'), 'var(--seq-light)']];
    const max = Math.max(1, ...weeks.flatMap(w => TIERS.map(([k]) => (w.createdByTier || {})[k] || 0)));
    const plotW = W - left - right, plotH = H - top - bottom, colW = plotW / n, barW = Math.min(16, colW * 0.3);
    const y = v => top + plotH - plotH * v / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications per week by dealer tier">`;
    [0, 0.5, 1].forEach(f => { const yy = y(max * f); s += `<line class="grid" x1="${left}" x2="${W - right}" y1="${yy}" y2="${yy}"/><text x="${left - 6}" y="${yy + 4}" text-anchor="end">${Math.round(max * f)}</text>`; });
    weeks.forEach((w, i) => {
      const cx = left + colW * i + colW / 2;
      TIERS.forEach(([k, label, color], j) => {
        const v = (w.createdByTier || {})[k] || 0, x = cx + (j - 1) * barW + 1;
        if (v) s += `<rect class="bar" x="${x}" y="${y(v)}" width="${barW - 2}" height="${Math.max(y(0) - y(v), 1)}" rx="2" fill="${color}" data-tip="${esc(t(`${w.label} 주 · ${label}: ${v}건 신청, 승인 ${(w.approvedByTier || {})[k] || 0}`, `week ${w.label} · ${label}: ${v} applications, ${(w.approvedByTier || {})[k] || 0} approved`))}"/>`;
      });
      s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="lbl">${esc(w.label)}</text>`;
    });
    s += `</svg><div class="legend">${TIERS.map(([, label, color]) => `<span><span class="dot" style="background:${color}"></span>${label}</span>`).join('')}</div>`;
    return s;
  }

  /* Fraud network: applications tied by a shared ID number, phone or name + date of birth, with the dealers they came
     through. A small force layout (deterministic, so the picture stays put across refreshes) drawn as SVG. */
  const LINK_STYLE = {
    SAME_ID: { color: 'var(--critical)', width: 2.5, dash: '', ko: '같은 신분증 번호', en: 'same ID number' },
    SAME_PHONE: { color: 'var(--serious)', width: 2, dash: '', ko: '같은 전화번호', en: 'same phone' },
    DUPLICATE: { color: 'var(--text-3)', width: 1.5, dash: '4 3', ko: '중복 신청', en: 'duplicate application' },
    SAME_NAME: { color: 'var(--warn)', width: 1.5, dash: '2 3', ko: '같은 이름·생년월일', en: 'same name & DOB' },
    DEALER: { color: 'var(--border)', width: 1, dash: '', ko: '접수 딜러', en: 'filed by dealer' },
  };
  function layoutNetwork(nodes, links, W, H, pinned) {
    let seed = 20261027; const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
    const idx = new Map(nodes.map((x, i) => [x.id, i])), n = nodes.length;
    const px = new Float64Array(n), py = new Float64Array(n), vx = new Float64Array(n), vy = new Float64Array(n);
    const clusters = [...new Set(nodes.map(x => x.cluster).filter(x => x != null))];
    const clusterOfDealer = id => nodes.find(a => a.type === 'application' && links.some(l => l.kind === 'DEALER' && l.source === a.id && l.target === id))?.cluster;
    nodes.forEach((x, i) => {
      const c = clusters.indexOf(x.cluster ?? clusterOfDealer(x.id));
      const ang = ((c >= 0 ? c : i) / Math.max(clusters.length, 1)) * Math.PI * 2;
      px[i] = W / 2 + Math.cos(ang) * W / 3.2 + (rnd() - .5) * 50; py[i] = H / 2 + Math.sin(ang) * H / 3.2 + (rnd() - .5) * 50;
      const pin = pinned && pinned.get(x.id); if (pin) { px[i] = pin.x; py[i] = pin.y; }
    });
    const fixed = nodes.map(x => !!(pinned && pinned.has(x.id)));
    const L = links.map(l => [idx.get(l.source), idx.get(l.target), l.kind === 'DEALER' ? 80 : 50, l.kind === 'DEALER' ? 0.03 : 0.08]).filter(l => l[0] != null && l[1] != null);
    for (let it = 0; it < 320; it++) {
      const alpha = 1 - it / 320;
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        const dx = px[j] - px[i], dy = py[j] - py[i], d2 = Math.max(dx * dx + dy * dy, 1), d = Math.sqrt(d2), f = 2200 / d2;
        vx[i] -= dx / d * f; vy[i] -= dy / d * f; vx[j] += dx / d * f; vy[j] += dy / d * f;
      }
      for (const [a, b, len, k] of L) {
        const dx = px[b] - px[a], dy = py[b] - py[a], d = Math.max(Math.sqrt(dx * dx + dy * dy), 1), f = (d - len) * k;
        vx[a] += dx / d * f; vy[a] += dy / d * f; vx[b] -= dx / d * f; vy[b] -= dy / d * f;
      }
      for (let i = 0; i < n; i++) {
        if (fixed[i]) { vx[i] = vy[i] = 0; continue; }
        vx[i] += (W / 2 - px[i]) * 0.012; vy[i] += (H / 2 - py[i]) * 0.012;
        px[i] = Math.max(24, Math.min(W - 24, px[i] + vx[i] * alpha * 0.5)); py[i] = Math.max(20, Math.min(H - 20, py[i] + vy[i] * alpha * 0.5));
        vx[i] *= 0.55; vy[i] *= 0.55;
      }
    }
    return nodes.map((x, i) => ({ x: px[i], y: py[i] }));
  }
  function fraudNetworkCard(net) {

  main.addEventListener('keydown', e => {
    const b = e.target.closest('[data-tab]'); if (!b || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const i = TABS.findIndex(x => x[0] === b.dataset.tab); const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0];
    showTab(n); main.querySelector(`[data-tab="${n}"]`).focus(); e.preventDefault();
  });
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== activeTab) showTab(id); });

  async function load() {
    const key = keyInput.value.trim();
    if (!key) { status.textContent = t('관리자 키를 입력하세요.', 'Enter the admin key.'); status.className = 'status err'; return; }
    if (/[^\x21-\x7e]/.test(key)) { status.textContent = t('관리자 키에 영문·숫자 외 문자가 들어 있습니다. 키만 다시 붙여 넣어 주세요.', 'The admin key contains characters other than letters and digits. Paste only the key.'); status.className = 'status err'; return; }
    try { sessionStorage.setItem('adminKey', key); } catch {}
    status.textContent = t('불러오는 중…', 'Loading…'); status.className = 'status';
    try {
      const [res, netRes] = await Promise.all([fetch('/admin/dashboard/stats', { headers: { 'X-Admin-Key': key } }), fetch('/admin/fraud-network', { headers: { 'X-Admin-Key': key } }).catch(() => null)]);
      if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.error || ('HTTP ' + res.status)); }
      lastNetwork = netRes && netRes.ok ? await netRes.json().catch(() => null) : null;
      render(await res.json());
      status.textContent = t('업데이트 ', 'Updated ') + new Date().toLocaleTimeString(LANG.locale, { hour12: false });
      $('#auto').hidden = false;
    } catch (e) {
      status.textContent = t('오류: ', 'Error: ') + e.message; status.className = 'status err';
    }
  }
  $('#load').addEventListener('click', load);
  $('#refresh').addEventListener('click', load);
  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  // Language switch: redraw the last payload; the static markup is swapped by lang.js itself.
  LANG.onChange(() => { if (lastData) render(lastData); if (copilotEl.innerHTML) paintCopilot(); });
  if (keyInput.value) load();
  setInterval(() => { if (keyInput.value.trim() && !document.hidden) load(); }, AUTO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && keyInput.value.trim()) load(); });
})();
</script>
</body>
</html>
