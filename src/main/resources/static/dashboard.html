<title data-ko="NEXUS AI 온보딩 대시보드" data-en="NEXUS AI Onboarding Dashboard">NEXUS AI 온보딩 대시보드</title>

<script src="/fds.js?v=4"></script>
<style>
  /* Header: white bar, deep-blue top rule, NEXUS logo + product name */
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .brand .mark { flex: none; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -0.03em; display: grid; place-items: center; }
  .brand .group { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: .01em; line-height: 1.2; }
  .brand .group .svc { color: var(--text-3); font-weight: 500; }
  footer { max-width: 1400px; margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; font-size: 12px; color: var(--text-3); }
  footer b { color: var(--brand); font-weight: 700; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
  button:hover:not(:disabled) { border-color: var(--brand-3); color: var(--brand); }
  button.primary:hover:not(:disabled) { background: var(--brand-2); color: #fff; }
  button.approve:hover:not(:disabled), button.reject:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  ::selection { background: var(--brand-tint); }
  /* Page switch between the dashboard and the review page (no login: the demo back office is open) */
  .pages { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); margin-right: 12px; }
  .pages a { padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .pages a:hover { color: var(--brand); }
  .pages a[aria-current="page"] { background: var(--brand); color: #fff; }
  @media (max-width: 700px) { .brand .mark { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; } h1 small { display: none; } }
  /* Palette from the KOIN Bridge deck: deep teal #0B3C49, teal #028090, amber #F2A541, teal-grey neutrals, red #C0392B. */
  :root {
    color-scheme: light;
    --brand: #0b3c49; --brand-2: #028090; --brand-3: #5faab4; --brand-sky: #f2a541; --brand-navy: #0b3c49; --brand-tint: #e6f2f3;
    --page: #f5f9fa; --surface: #ffffff; --surface-2: #eef4f5; --border: #d5e0e3; --grid: #e6eef0;
    --text: #1f2933; --text-2: #5f6c72; --text-3: #7a858b;
    --c-id: #028090; --c-mm: #f2a541; --c-kh: #0b3c49;                 /* categorical slots 1-3: Indonesia, Myanmar, Cambodia */
    --seq: var(--brand-2); --seq-light: #b7d3d7;                        /* sequential teal */
    --good: #0e9f6e; --warn: #f2a541; --serious: #ec7a3c; --critical: #c0392b;
    --hot: #f2a541; --hot-ink: #2b1d00; --hot-line: #c9851f; --hot-text: #8a5700; --hot-soft: #fce9c8; --good-bg: #e6f7ef; --warn-bg: #fdf1dc; --serious-bg: #fdebe0; --critical-bg: #f9e7e5; --info-bg: var(--brand-tint);
    --shadow: 0 1px 2px rgba(11, 60, 73, .06), 0 4px 16px rgba(11, 60, 73, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #1f8f9e; --brand-2: #4fb6c3; --brand-3: #7fcad4; --brand-navy: #0b3c49; --brand-tint: #123f4b;
      --page: #06202a; --surface: #0b2c37; --surface-2: #123a46; --border: #1f4b58; --grid: #184250;
      --text: #e8f1f3; --text-2: #b3c6cb; --text-3: #87a0a7;
      --c-id: #4fb6c3; --c-mm: #f2a541; --c-kh: #a7dce3;
      --seq: var(--brand); --seq-light: #1f5e6c;
      --good: #34c38f; --critical: #ef5350;
      --hot: #f2a541; --hot-ink: #2b1d00; --hot-line: #d4912f; --hot-text: #f2a541; --hot-soft: #3d2f14; --good-bg: #123a2c; --warn-bg: #3d2f14; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #1f8f9e; --brand-2: #4fb6c3; --brand-3: #7fcad4; --brand-navy: #0b3c49; --brand-tint: #123f4b;
    --page: #06202a; --surface: #0b2c37; --surface-2: #123a46; --border: #1f4b58; --grid: #184250;
    --text: #e8f1f3; --text-2: #b3c6cb; --text-3: #87a0a7;
    --c-id: #4fb6c3; --c-mm: #f2a541; --c-kh: #a7dce3;
    --seq: var(--brand); --seq-light: #1f5e6c;
    --good: #34c38f; --critical: #ef5350;
    --hot: #f2a541; --hot-ink: #2b1d00; --hot-line: #d4912f; --hot-text: #f2a541; --hot-soft: #3d2f14; --good-bg: #123a2c; --warn-bg: #3d2f14; --serious-bg: #3f2616; --critical-bg: #3f1b1b; --info-bg: var(--brand-tint);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 "SUIT Variable", SUIT, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border-top: 4px solid var(--brand); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
  h2 small, .sub { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
  main { padding: 20px 24px 8px; display: grid; gap: 20px; max-width: 1200px; margin: 0 auto; }
  .row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .k small { color: var(--text-3); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--brand); font-variant-numeric: tabular-nums; }
  .tile.alert .v { color: var(--critical); }
  .tile.good .v { color: var(--good); }
  #panel-dealers th { white-space: nowrap; }
  .action { border: 1px solid var(--border); border-radius: 12px; }
  .chip.fraud { border-color: var(--critical); color: var(--critical); }
  .notice { padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
  .notice.ok { background: var(--good-bg); color: var(--good); }
  .key { display: flex; gap: 8px; align-items: center; }
  .logout { font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .logout:hover { border-color: var(--brand-3); color: var(--brand); }
  input[type=password], input[type=text] { font: inherit; padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); min-width: 220px; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button.primary { background: var(--brand); color: #fff; border-color: transparent; }
  /* Onboarding stage stepper (review detail) and the mini progress bar (queue rows, dashboard) */
  .stepper { list-style: none; margin: 8px 0 0; padding: 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }
  .stepper li { flex: 1 1 0; min-width: 96px; position: relative; padding: 0 6px 0 0; text-align: center; }
  .stepper li::before { content: ""; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--grid); }
  .stepper li.DONE::before, .stepper li.SKIPPED::before { background: var(--brand-3); }
  .stepper .dot { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface); border: 2px solid var(--grid); color: var(--text-3); }
  .stepper .DONE .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper .SKIPPED .dot { background: var(--surface-2); border-color: var(--brand-3); color: var(--brand); }
  .stepper .CURRENT .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-tint); animation: pulse 1.4s infinite; }
  .stepper .WARN .dot { background: var(--warn); border-color: var(--warn); color: #000; }
  .stepper .FAIL .dot { background: var(--critical); border-color: var(--critical); color: #fff; }
  .stepper .lb { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); line-height: 1.2; }
  .stepper .PENDING .lb { color: var(--text-3); font-weight: 500; }
  .stepper .CURRENT .lb { color: var(--brand); }
  .stepper .lb small { display: block; font-weight: 400; color: var(--text-3); font-size: 10px; }
  .stepper .note { display: block; font-size: 11px; color: var(--text-2); margin-top: 2px; line-height: 1.25; }
  .stepper .WARN .note { color: var(--serious); } .stepper .FAIL .note { color: var(--critical); }
  .stepper time { display: block; font-size: 10px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .progress-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .progress-head .pct { font-size: 20px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
  .mini { display: inline-block; width: 64px; height: 6px; border-radius: 999px; background: var(--grid); vertical-align: middle; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .mini.warn i { background: var(--warn); } .mini.done i { background: var(--good); }
  .segbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--grid); margin: 10px 0 8px; }
  .segbar i { display: block; height: 100%; min-width: 2px; }
  .stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .stages .s { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--brand-3); }
  button.s { font: inherit; text-align: left; border: 0; border-left: 3px solid var(--brand-3); width: 100%; color: inherit; cursor: pointer; }
  button.s:hover:not(:disabled) { background: var(--brand-tint); color: inherit; }
  button.s[aria-pressed="true"] { background: var(--brand-tint); box-shadow: inset 0 0 0 2px var(--brand); }
  button.s:disabled { cursor: default; }
  .pipe-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 16px 0 6px; font-size: 13px; color: var(--text-2); }
  .pipe-head .dl-chip { margin-left: auto; }
  .stages .s .n { font-size: 20px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stages .s .k { font-size: 11px; color: var(--text-2); font-weight: 600; } .stages .s .k small { display: block; color: var(--text-3); font-weight: 400; }
  .stages .s.zero .n { color: var(--text-3); } .stages .s.zero { border-left-color: var(--grid); }
  .dots { display: inline-flex; gap: 2px; vertical-align: middle; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
  .dots i.DONE, .dots i.SKIPPED { background: var(--brand); } .dots i.CURRENT { background: var(--brand-3); box-shadow: 0 0 0 2px var(--brand-tint); }
  .dots i.WARN { background: var(--warn); } .dots i.FAIL { background: var(--critical); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 82px 16px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: start; }
  .feed time { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .feed .node { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--text-3); }
  .feed .node.ANALYSIS { background: var(--brand); } .feed .node.VALIDATION { background: var(--brand-3); } .feed .node.AGENT { background: #8b5cf6; }
  .feed .node.VERIFICATION { background: var(--c-kh); } .feed .node.RISK { background: var(--serious); } .feed .node.OUTCOME { background: var(--good); } .feed .node.OFFICER { background: var(--warn); }
  .feed .st { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); margin-left: 4px; }
  .feed .st.OK { color: var(--good); } .feed .st.FAIL { color: var(--critical); } .feed .st.WARN { color: var(--serious); } .feed .st.DECISION { color: var(--brand); }
  .feed .t { color: var(--text-2); font-size: 12px; }
  .feed li.new { animation: arrive 3s ease-out; }
  @keyframes arrive { 0%, 70% { background: var(--info-bg); } 100% { background: transparent; } }
  /* Excellent dealer board: summary, top three, ranking with a detail panel. Scores come from DealerScorecard. */
  .dl { display: flex; flex-direction: column; gap: 14px; min-width: 0; scroll-margin-top: 96px; }
  .dl > * { min-width: 0; }
  .dl-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 12px; }
  .dl-head h2 { margin: 0; }
  .dl-sample { font-size: 12px; font-weight: 600; color: var(--hot-text); background: var(--hot-soft); padding: 4px 10px; border-radius: 6px; }
  .dl-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .dl-kpi, .dl-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
  .dl-kpi { padding: 14px 16px; }
  .dl-kpi .l, .dl-kpi .note { font-size: 12px; color: var(--text-2); }
  .dl-kpi .v { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dl-kpi .v small { font-size: 13px; font-weight: 400; color: var(--text-2); margin-left: 4px; }
  .dl-podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .dl-card { position: relative; font: inherit; text-align: left; cursor: pointer; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  button.dl-card:hover:not(:disabled) { border-color: var(--hot-line); color: var(--text); }
  .dl-card[aria-pressed="true"] { border-color: var(--hot-line); box-shadow: 0 0 0 1px var(--hot-line); }
  .dl-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dl-card .rk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--hot-text); }
  .dl-card .rk svg { width: 16px; height: 16px; fill: currentColor; }
  .dl-card .body { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .dl-card .nm { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .dl-card .rg { font-size: 12px; color: var(--text-2); }
  .dl-card .sc { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .dl-card .meta { display: flex; gap: 18px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px; }
  .dl-card .meta div { display: flex; flex-direction: column; }
  .dl-card .meta span:first-child { color: var(--text-2); }
  .dl-card .meta span:last-child { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dl-card.p1, button.dl-card.p1:hover:not(:disabled) { color: var(--hot-ink); border: 4px solid transparent; padding: 11px 13px;
    background: linear-gradient(160deg, #f7c06e, #f2a541 60%, #f5b35a) padding-box, linear-gradient(135deg, #fde5bd 0%, #d98f2b 22%, #fbdca8 45%, #a86a14 70%, #f7c987 100%) border-box;
    box-shadow: 0 0 0 1px #a86a14, 0 8px 24px rgba(242, 165, 65, .45); }
  .dl-card.p1[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px #a86a14, 0 8px 24px rgba(242, 165, 65, .55); }
  .dl-card.p1 .rk { color: inherit; }
  .dl-card.p1 .rg, .dl-card.p1 .meta span:first-child { color: inherit; opacity: .8; }
  .dl-card.p1 .meta { border-top-color: rgba(43, 29, 0, .28); }
  .dl-main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .dl-phead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .dl-phead h2 { margin: 0; font-size: 15px; }
  .dl-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dl-chips { display: flex; gap: 4px; }
  .dl-chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-2); cursor: pointer; }
  .dl-chip[aria-pressed="true"] { background: var(--brand-tint); color: var(--brand); border-color: var(--brand); font-weight: 600; }
  .dl-search { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); width: 150px; }
  .dl-table { overflow-x: auto; }
  .dl-table table { width: 100%; min-width: 620px; border-collapse: collapse; }
  .dl-table th { font-size: 12px; font-weight: 500; color: var(--text-2); text-align: right; padding: 8px 7px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .dl-table td { padding: 10px 7px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .dl-table th.l, .dl-table td.l { text-align: left; }
  .dl-table tbody tr { cursor: pointer; }
  .dl-table tbody tr:last-child td { border-bottom: 0; }
  .dl-table tbody tr:hover { background: var(--surface-2); }
  .dl-table tbody tr[aria-selected="true"] { background: var(--brand-tint); }
  .dl-table tr.top td.l:first-child { box-shadow: inset 3px 0 0 var(--hot); }
  .dl-table tr.top[aria-selected="true"] { background: var(--hot-soft); }
  .dl-table tr.top .name { font-size: 15px; }
  .dl-table .rank { width: 40px; text-align: center; color: var(--text-2); }
  .dl-table .name { font-weight: 600; }
  .dl-table .rg { font-size: 12px; color: var(--text-2); }
  .dl-table .bad { color: var(--critical); font-weight: 600; }
  .dl-medal { width: 26px; height: 32px; display: block; margin: 0 auto; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .25)); }
  .dl-sc { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .dl-bar { width: 36px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .dl-bar > i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
  .dl-grade { display: inline-block; min-width: 40px; text-align: center; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; }
  .dl-grade.S { background: var(--brand); color: #fff; }
  .dl-grade.A { background: var(--brand-tint); color: var(--brand); }
  .dl-grade.B { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
  .dl-grade.C { background: var(--warn-bg); color: var(--hot-text); }
  .dl-grade.none { background: transparent; color: var(--text-3); border-color: var(--border); font-weight: 500; }

  const appLink = n => `<a class="app" href="/review?app=${encodeURIComponent(n)}" title="${t('심사 화면에서 열기', 'Open in the review page')}">${esc(n)}</a>`;
  const pill = s => `<span class="pill ${esc(s)}">${esc(statusName(s))}</span>`;
  const hrs = h => h == null ? '–' : h < 1 ? Math.round(h * 60) + t('분', 'm') : h < 48 ? h.toFixed(1) + 'h' : (h / 24).toFixed(1) + 'd';
  const agoText = h => h == null ? '–' : t(hrs(h) + ' 전', hrs(h) + ' ago');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
  const num = v => v == null ? '–' : (Number.isInteger(v) ? v : v.toFixed(0));
  const fmtTime = iso => { try { return new Date(iso).toLocaleString(LANG.locale, { hour12: false }); } catch { return iso; } };
  const fmtShort = iso => { try { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; } catch { return iso; } };
  let pipelineStages = [];   // stage code -> labels, from the last payload (progress rows carry only the code and the Korean label)
  const curStage = r => LANG.lang === 'en' ? (pipelineStages.find(s => s.code === r.current)?.label || r.current) : r.currentKo;
  const noteOf = r => (LANG.lang === 'en' ? (r.noteEn ?? r.note) : r.note) || '';
  const STAGE_COLORS = ['#b7d3d7', '#8fc2ca', '#5faab4', '#2f95a2', '#028090', '#026a78', '#0b5563', '#0b3c49', '#f2a541'];
  const AUTO_MS = 15000;
  let seenStepKeys = null;   // activity-feed keys already shown, to highlight what is new on each refresh
  let lastData = null;       // last payload, redrawn as is when the language changes
  let lastNetwork = null;    // fraud network, loaded alongside the stats

  function showTip(e, text) { tip.textContent = text; tip.style.opacity = 1; moveTip(e); }
  function moveTip(e) { tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; }
  function hideTip() { tip.style.opacity = 0; }
  function bindTips(root) {
    root.querySelectorAll('[data-tip]').forEach(el => {
      el.addEventListener('mouseenter', e => showTip(e, el.dataset.tip));
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', hideTip);
    });
  }

  /* Horizontal bar chart: rows = [{label, value, color, tip}] ; one axis, thin marks, rounded data-end, gaps between bars. */
  let hbarGrad = 0;
  /* Rounded gradient bars on a soft track, value at the right edge, no grid: the analysis tab's look. r.grad = [from, to]. */
  function softBars(rows, opts = {}) {
    const W = 340, rowH = 32, left = opts.left || 96, right = 34, h = 14, H = rows.length * rowH + 4, plot = W - left - right;
    const max = Math.max(1, ...rows.map(r => r.value));
    let defs = '', s = '';
    rows.forEach((r, i) => {
      const y = 2 + i * rowH + (rowH - h) / 2, w = r.value > 0 ? Math.max(h, plot * r.value / max) : 0, id = 'sb' + (++hbarGrad);
      defs += `<linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${r.grad[0]}"/><stop offset="1" stop-color="${r.grad[1]}"/></linearGradient>`;
      s += `<text x="${left - 10}" y="${y + h / 2 + 4}" text-anchor="end" class="lbl">${esc(r.label)}</text>`;
      s += `<rect class="track" x="${left}" y="${y}" width="${plot}" height="${h}" rx="${h / 2}"/>`;
      if (w) s += `<rect class="bar" x="${left}" y="${y}" width="${w.toFixed(1)}" height="${h}" rx="${h / 2}" fill="url(#${id})" data-tip="${esc(r.tip || r.label + ': ' + r.value)}"/>`;
      s += `<text x="${W}" y="${y + h / 2 + 4}" text-anchor="end" class="val">${r.value}</text>`;
    });
    return `<svg class="softbars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}"><defs>${defs}</defs>${s}</svg>`;
  }

  function hbars(rows, opts = {}) {
    const W = 520, rowH = 26, left = opts.left || 120, right = 44, top = 4;
    const H = top + rows.length * rowH + 4;
    const max = Math.max(1, ...rows.map(r => r.value));
    const scale = v => (W - left - right) * v / max;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || '')}">`;
    [0.25, 0.5, 0.75, 1].forEach(f => { const x = left + scale(max * f); s += `<line class="grid" x1="${x}" x2="${x}" y1="${top}" y2="${H - 4}"/>`; });
    rows.forEach((r, i) => {
      const y = top + i * rowH + 5, h = rowH - 10, w = Math.max(r.value > 0 ? 4 : 0, scale(r.value));
      s += `<text x="${left - 8}" y="${y + h / 2 + 4}" text-anchor="end" class="lbl">${esc(r.label)}</text>`;
      if (w > 0) s += `<path class="bar" data-tip="${esc(r.tip || r.label + ': ' + r.value)}" d="M${left},${y} h${w - 4} a4,4 0 0 1 4,4 v${h - 8} a4,4 0 0 1 -4,4 h-${w - 4} z" fill="${r.color}"/>`;
      s += `<text x="${left + w + 6}" y="${y + h / 2 + 4}">${r.value}</text>`;
    });
    return s + '</svg>';
  }

  /* Fraud network: applications tied by a shared ID number, phone or name + date of birth, with the dealers they came
     through. A small force layout (deterministic, so the picture stays put across refreshes) drawn as SVG. */
  const LINK_STYLE = {
    SAME_ID: { color: 'var(--critical)', width: 2.5, dash: '', ko: '같은 신분증 번호', en: 'same ID number' },
    SAME_PHONE: { color: 'var(--serious)', width: 2, dash: '', ko: '같은 전화번호', en: 'same phone' },
    DUPLICATE: { color: 'var(--text-3)', width: 1.5, dash: '4 3', ko: '중복 신청', en: 'duplicate application' },
    SAME_NAME: { color: 'var(--warn)', width: 1.5, dash: '2 3', ko: '같은 이름·생년월일', en: 'same name & DOB' },
    DEALER: { color: 'var(--border)', width: 1, dash: '', ko: '접수 딜러', en: 'filed by dealer' },
  };
  function fraudNetworkCard(net) {
    const title = `<div style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${t('사기 연결망 탐지', 'Fraud network detection')} <small>${t('같은 신분증 번호 · 같은 전화번호 · 같은 이름을 선으로 이어 의심 묶음을 보여줘요', 'applications tied by the same ID number, phone or name, with the dealers they came through')}</small></h2><button type="button" class="btn-standard" data-standard="fraud">${t('연결망 설명 보기', 'How this works')}</button></div>`;
    if (!net) return `<section class="card">${title}<p class="empty">${t('연결망을 불러오지 못했어요.', 'The network could not be loaded.')}</p></section>`;
    if (!net.clusters.length) return `<section class="card">${title}<p class="notice ok">${t(`신청 ${net.scanned}건을 대조했지만 신분증 번호·전화번호·이름이 겹치는 묶음이 없어요.`, `${net.scanned} applications compared; no shared ID numbers, phones or names.`)}</p></section>`;
    const clusters = net.clusters.map(c => `<div class="action" style="border-left:3px solid ${c.severity === 'HIGH' ? 'var(--critical)' : 'var(--warn)'};padding:8px 10px;margin-bottom:8px"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${t('묶음', 'Ring')} ${c.id}</b><span class="chip ${c.severity === 'HIGH' ? 'fraud' : ''}">${c.severity === 'HIGH' ? t('높음', 'high') : t('중간', 'medium')}</span>${c.singleDealer ? `<span class="chip">${t('단일 딜러', 'single dealer')}</span>` : ''}</div><div class="sub" style="display:block;margin-top:2px">${esc(LANG.lang === 'en' ? c.summary : c.summaryKo)}</div><div style="margin-top:4px">${c.applications.map(n => appLink(n)).join(' · ')}</div></div>`).join('');
    return `<section class="card">${title}<div class="fds-rings">${clusters}</div>
      <p class="sub" style="display:block;margin:8px 0 0">${t('리스크 규칙은 나중에 들어온 신청에만 "동일 신분증 번호" 플래그를 올려요. 이 연결망은 먼저 들어온 신청까지 묶어 사람이 한 건씩 볼 때는 놓치는 연결을 보여줘요.', 'The risk rules flag only the later application of a pair. This network ties the earlier ones in too, showing connections a one-by-one review misses.')}</p>
    </section>`;
  }

  function gradeCell(g) { const m = GRADE[g] || { color: 'var(--text-3)', icon: '○', ko: '미평가', en: 'n/a' }; return `<span class="grade"><span class="ic" style="background:${m.color}"></span>${esc(g || '–')} <span class="sub" style="display:inline">${t(m.ko, m.en)}</span></span>`; }

  const TABS = [
    ['stats', '통계', 'Statistics'], ['overview', '분석', 'Analysis'], ['pipeline', '진행 현황', 'Pipeline'], ['queue', '심사 대기 큐', 'Review queue'], ['risk', '리스크·사기', 'Risk & fraud'],
    ['agent', 'AI 에이전트', 'AI agent'],
  ];
  // Old links and remembered tabs: these sections now live on the statistics tab.
  const tabAlias = id => ({ dealers: 'overview', country: 'stats' }[id] || id);
  let activeTab = 'stats';
  try { activeTab = tabAlias(sessionStorage.getItem('dashboardTab') || activeTab); } catch {}
  if (!TABS.some(x => x[0] === activeTab)) activeTab = 'stats';
  if (location.hash.length > 1 && TABS.some(x => x[0] === tabAlias(location.hash.slice(1)))) activeTab = tabAlias(location.hash.slice(1));

  // New arrivals in the pipeline's in-progress list and the review queue. The first load only sets the baseline, so opening the page marks nothing;
  // an application that leaves the queue and comes back (documents re-requested, then resubmitted) counts as new again.
  const NEW_MS = 180000;
  function newTracker(tab) {
    const since = new Map();   // application number -> when it first showed up in this list
    let seen = null;
    function end() {
      const now = Date.now();
      since.forEach((at, n) => { if (now - at >= NEW_MS) since.delete(n); });
      main.querySelectorAll(`[data-panel="${tab}"] tr.is-new`).forEach(r => { if (!since.has(r.dataset.newApp)) r.classList.remove('is-new'); });
      if (!since.size) main.querySelector(`[data-tab="${tab}"]`)?.classList.remove('is-new');
    }
    return {
      track(numbers) {
        const now = Date.now();
        if (seen) numbers.filter(n => !seen.has(n)).forEach(n => { since.set(n, now); setTimeout(end, NEW_MS + 100); });   // +100: a timer can fire a millisecond early, which would leave the mark until the next refresh
        seen = new Set(numbers);
        [...since.keys()].forEach(n => { if (!seen.has(n)) since.delete(n); });
        end();
      },
      dismiss(n) { if (since.delete(n)) end(); },
      rowAttrs: n => since.has(n) ? ` class="is-new" data-new-app="${esc(n)}"` : '',
      tabAttrs: () => since.size ? ' class="is-new"' : '',
    };
  }
  const newInTab = { pipeline: newTracker('pipeline'), queue: newTracker('queue') };
  // Clicking a marked row ends its highlight, in every list it is marked in.
  main.addEventListener('click', e => { const row = e.target.closest('tr.is-new'); if (row) Object.values(newInTab).forEach(x => x.dismiss(row.dataset.newApp)); });

  /* Excellent dealer board. The numbers come from the scorecard on each dealer in the stats (DealerScorecard); the
     chosen dealer, grade filter and search live here so they survive the auto-refresh. */
  const dlState = { grade: 'all', q: '', sel: null };
  const dlGradeLabel = g => g === 'C' ? t('관리', 'Watch') : g;
  const dlGrade = c => c.rated ? `<span class="dl-grade ${c.grade}">${dlGradeLabel(c.grade)}</span>` : `<span class="dl-grade none">${t('평가 전', 'Not rated')}</span>`;
  const dlCountry = (d, x) => { const c = (d.byCountry || []).find(y => y.code === x.country); return c ? L(c, 'name') : x.country; };
  const dlSearchText = (d, x) => { const c = (d.byCountry || []).find(y => y.code === x.country); return `${x.name} ${x.code} ${x.country} ${c?.name ?? ''} ${c?.nameKo ?? ''}`.toLowerCase(); };
  const dlList = d => d.dealers.filter(x => stState.market === 'ALL' || x.country === stState.market);
  const dlSorted = d => dlList(d).sort((a, b) => (a.scorecard.rank ?? 1e6) - (b.scorecard.rank ?? 1e6) || b.metrics.applications - a.metrics.applications);
  /* Rank within the market on screen: the server's rank orders the same way, across all markets. */
  const dlRankOf = (d, x) => { if (!x.scorecard.rated) return null; return dlSorted(d).filter(y => y.scorecard.rated).findIndex(y => y.code === x.code) + 1; };
  const DL_MEDALS = {
    1: { ko: '금메달', en: 'Gold', ribbon: '#d64545', fill: '#f5c211', edge: '#a87000', inner: '#ffe066' },
    2: { ko: '은메달', en: 'Silver', ribbon: '#3f6fb8', fill: '#cfd5de', edge: '#6f7885', inner: '#eef1f5' },
    3: { ko: '동메달', en: 'Bronze', ribbon: '#2f8a64', fill: '#d0873f', edge: '#80481a', inner: '#e9ad6c' },
  };
  function dlMedal(rank) {
    const m = DL_MEDALS[rank];
    if (!m) return rank ?? '–';
    return `<svg class="dl-medal" viewBox="0 0 26 32" role="img" aria-label="${t(m.ko, m.en)} ${rank}"><path d="M5 0h6l3.5 11H8.5z" fill="${m.ribbon}"/><path d="M21 0h-6l-3.5 11H17.5z" fill="${m.ribbon}" opacity=".8"/><circle cx="13" cy="20" r="10" fill="${m.fill}" stroke="${m.edge}" stroke-width="1.5"/><circle cx="13" cy="20" r="7.3" fill="${m.inner}" stroke="${m.edge}" stroke-width=".8" opacity=".9"/><text x="13" y="24.2" text-anchor="middle" font-size="11" font-weight="700" fill="#2b1d00">${rank}</text></svg>`;
  }
  function dlKpis(d) {
    const dealers = dlList(d);
    const top = dealers.filter(x => x.scorecard.grade === 'S' || x.scorecard.grade === 'A');
    const gradeCount = g => dealers.filter(x => x.scorecard.grade === g).length;
    const apps = list => list.reduce((s, x) => s + x.scorecard.applications, 0);
    const share = list => { const a = list.reduce((s, x) => s + x.scorecard.assessed, 0); return a ? list.reduce((s, x) => s + Math.round((x.scorecard.highRiskRate || 0) * x.scorecard.assessed), 0) / a : null; };
    const capped = dealers.filter(x => x.scorecard.cap === 'FRAUD');
    const all = apps(dealers), topApps = apps(top);
    const items = [
      [t('우수 딜러 (S·A)', 'Excellent dealers (S·A)'), top.length, `/ ${dealers.length}${t('곳', '')}`, `S ${gradeCount('S')} · A ${gradeCount('A')}`],
      [t('우수 딜러 신청 비중', 'Share of applications'), all ? (topApps / all * 100).toFixed(0) : '–', '%', t(`전체 ${all}건 중 ${topApps}건`, `${topApps} of ${all} applications`)],
      [t('고위험 비율 (C·D)', 'High-risk share (C·D)'), pct(share(top)).replace('%', ''), t('% 우수', '% excellent'), `${t('전체', 'all dealers')} ${pct(share(dealers))}`],
      [t('위조 경고 등급 제한', 'Capped by fraud warnings'), capped.length, t('곳', 'dealers'), capped.length ? capped.map(x => x.name).join(', ') + t(' (B 상한)', ' (at most B)') : t('해당 없음', 'none')],
    ];
    return items.map(([l, v, u, n]) => `<div class="dl-kpi"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div><div class="note">${esc(n)}</div></div>`).join('');
  }
  function dlPodium(d) {
    const top = dlSorted(d).filter(x => x.scorecard.rated).slice(0, 3);
    return top.map((x, i) => { const c = x.scorecard; return `<button type="button" class="dl-card p${i + 1}" data-dl-sel="${esc(x.code)}" data-dl-kind="card" aria-pressed="${x.code === dlState.sel}">
      <div class="top"><span class="rk">${i === 0 ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v3c0 2.2-1.8 4-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8c-2.2 0-4-1.8-4-4V5h3V3zM6 7v1c0 1.1.9 2 2 2V7H6zm12 0h-2v3c1.1 0 2-.9 2-2V7z"/></svg>TOP 1 · ${t('최우수', 'Best')}` : `TOP ${i + 1}`}</span>${dlGrade(c)}</div>
      <div class="body"><div><div class="nm">${esc(x.name)}</div><div class="rg">${esc(dlCountry(d, x))} · ${esc(x.code)}</div></div><div class="sc">${c.score.toFixed(1)}</div></div>
      <div class="meta"><div><span>${t('승인율', 'Approval')}</span><span>${pct(c.approvalRate)}</span></div><div><span>${t('고위험 비율', 'High risk')}</span><span>${pct(c.highRiskRate)}</span></div><div><span>${t('위조 경고', 'Fraud')}</span><span>${c.fraudWarnings}${t('건', '')}</span></div></div></button>`; }).join('');
  }
  function dlRows(d) {
    const q = dlState.q.trim().toLowerCase();
    const list = dlSorted(d).filter(x => (dlState.grade === 'all' || x.scorecard.grade === dlState.grade) && (!q || dlSearchText(d, x).includes(q)));
    if (!list.length) return `<tr><td colspan="9"><div class="dl-empty">${t('조건에 맞는 딜러가 없습니다.', 'No dealers match.')}</div></td></tr>`;
    return list.map(x => { const c = x.scorecard, rank = dlRankOf(d, x), top = rank != null && rank <= 3; return `<tr tabindex="0" class="${top ? 'top' : ''}" data-dl-sel="${esc(x.code)}" data-dl-kind="row" aria-selected="${x.code === dlState.sel}">
      <td class="l rank">${dlMedal(rank)}</td>
      <td class="l"><div><span class="name">${esc(x.name)}</span>${c.cap === 'FRAUD' ? `<span class="dl-flag">${t('위조 경고', 'Fraud')}</span>` : ''}${c.tierReview ? `<span class="dl-flag review">${x.tier === 'EXCELLENT' ? t('등급 재검토', 'Tier review') : t('승격 후보', 'Promotion')}</span>` : ''}</div><div class="rg"><span class="dot" style="background:${COUNTRY_COLOR[x.country] || 'var(--text-3)'}"></span>${esc(dlCountry(d, x))} · ${esc(x.code)}</div></td>
      <td><span class="dl-sc"><span class="dl-bar"><i style="width:${c.score ?? 0}%"></i></span><span>${c.rated ? c.score.toFixed(1) : '–'}</span></span></td>
      <td>${dlGrade(c)}</td>
      <td>${pct(c.approvalRate)}</td>
      <td class="${(c.highRiskRate ?? 0) > 0.15 ? 'bad' : ''}">${pct(c.highRiskRate)}</td>
      <td class="${c.fraudWarnings ? 'bad' : ''}">${c.fraudWarnings}</td>
      <td class="${(c.reworkRate ?? 0) > 0.1 ? 'bad' : ''}">${pct(c.reworkRate)}</td>
      <td>${c.applications}</td></tr>`; }).join('');
  }
  function dlSpark(c) {
    const pts = c.trend.map((m, i) => ({ i, v: m.score, m: m.month })).filter(p => p.v != null);
    if (pts.length < 2) return `<p class="sub" style="display:block;margin:0">${t('추이를 그리기에는 이력이 부족해요.', 'Not enough history for a trend yet.')}</p>`;
    const W = 320, H = 110, pl = 28, pr = 14, pt = 12, pb = 22, n = c.trend.length;
    const lo = Math.max(0, Math.floor(Math.min(...pts.map(p => p.v)) - 3)), hi = Math.min(100, Math.ceil(Math.max(...pts.map(p => p.v)) + 3));
    const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (hi - v) * (H - pt - pb) / Math.max(hi - lo, 1);
    const line = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
    const area = `${line} L${x(pts.at(-1).i).toFixed(1)} ${H - pb} L${x(pts[0].i).toFixed(1)} ${H - pb} Z`;
    const grid = [lo, Math.round((lo + hi) / 2), hi].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
    const label = m => { const mo = Number(m.slice(5)); return LANG.lang === 'en' ? new Date(2000, mo - 1, 1).toLocaleString('en-GB', { month: 'short' }) : `${mo}월`; };

  /* AI dashboard copilot: portfolio-level questions answered from the same statistics this page shows

  const copilotLog = [];   // [{ role, content, mode, model, ms, err, inputTokens, outputTokens, label, showEngine, typing }]
  let copilotBusy = false;
  const AI_NAME = 'NEXUS AI';     // default assistant name; answers carry the server's label (app.copilot-label)
  const engineOf = m => m.mode === 'rules' ? t('규칙 엔진', 'rules engine') : m.mode === 'guard' ? t('질문 범위 제한', 'scope guard') : esc(m.model || m.mode);
  const labelOf = m => esc(m.label || AI_NAME) + (m.showEngine ? ' · ' + engineOf(m) : '');
  const thinkPause = () => new Promise(r => setTimeout(r, 700 + Math.random() * 900));   // a beat before the answer, even when the engine is instant
  /** Reveals an answer progressively in its bubble, then repaints with the footer. */
  function typeOut(el, m, done) {
    const total = m.content.length, step = Math.max(6, Math.round(total / 70)); let n = 0;
    const timer = setInterval(() => {
      if (!el.isConnected) { clearInterval(timer); m.typing = false; return; }
      n = Math.min(total, n + step);
      el.innerHTML = md(m.content.slice(0, n)) + (n < total ? '<span class="caret"></span>' : '');
      const log = el.closest('.log'); if (log) log.scrollTop = log.scrollHeight;
      if (n >= total) { clearInterval(timer); m.typing = false; done(); }
    }, 28);
  }
  const copilotEl = document.createElement('section'); copilotEl.className = 'card copilot'; copilotEl.id = 'copilot';
  const COPILOT_PROMPTS = [
    ['지금 전체 현황을 요약해줘', 'Summarise the portfolio right now'], ['심사 대기 큐에서 먼저 볼 신청은?', 'Which applications should officers look at first?'],
    ['현재 고위험 비율 기준을?', 'What is the current high-risk share standard?'], ['국가별 고위험 비율을 비교해줘', 'Compare the high-risk share by country'], ['가장 많이 발생한 위조·사기 Flag는?', 'Which fraud flags occur most?'],
    ['우수 딜러와 일반 딜러의 차이는?', 'How do excellent dealers differ from standard ones?'], ['주간 추이를 해석해줘', 'Interpret the weekly trend'], ['AI 에이전트가 한 일을 정리해줘', 'What did the AI agents do?'],
  ];
  const md = text => {
    const lines = esc(text).split(/\r?\n/); let h = '', list = false;

    for (const raw of lines) {
      const m = raw.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
      if (m) { if (!list) { h += '<ul>'; list = true; } h += `<li>${inline(m[1])}</li>`; continue; }
      if (list) { h += '</ul>'; list = false; }

    }
    return h + (list ? '</ul>' : '');

  function renderCopilot() {

      <div class="chips">${COPILOT_PROMPTS.map(([ko, en]) => `<button type="button" data-q="${esc(t(ko, en))}">${esc(t(ko, en))}</button>`).join('')}${copilotLog.length ? `<button type="button" data-clear="1" title="${t('이 대화를 지웁니다', 'Clear this conversation')}">${t('대화 지우기', 'Clear chat')}</button>` : ''}</div>

    ['승인율', 'Approval rate', '70% 이상', '70% or higher', '심사를 통과하는 고객을 데려오는지', 'brings customers who pass review'],
    ['고위험 비율 (C·D)', 'High-risk share (grade C or D)', '15% 이하', '15% or lower', '신청 전에 고객을 걸러내는지', 'screens customers before filing'],
    ['위조·사기 경고', 'Fraud or forgery warnings', '검토 기간 내 0건', 'none in the review window', '위조 신분증 1건이면 자격 상실', 'one forged ID disqualifies'],
    ['신원 일치율', 'Identity match rate', '90% 이상', '90% or higher', '정확한 고객 정보를 제출하는지', 'submits accurate customer data'],
    ['서류 재요청 비율', 'Resubmission rate', '10% 이하', '10% or lower', '처음부터 선명하고 완전한 서류를 내는지', 'files complete, clear documents first time'],
    ['활동 기간·준법', 'Tenure and conduct', '6개월 이상 활동, 준법 지적 없음', '6+ months active, no compliance findings', '안정성', 'stability'],
  ];
  /* The fraud network explained: what the picture shows, how two applications get tied, how a ring is graded, how to
     use it, and what to keep in mind. Mirrors FraudNetworkService. */
  const FRAUD_ROWS = [
    ['SAME_ID', '같은 신분증 번호', 'Same ID number', '신분증 번호가 같은데 전화번호나 이름이 달라요', 'same ID number, but a different phone or name', '다른 사람이 같은 신분증을 쓰고 있어요 — 신원 도용 의심', 'another person is using the same ID — possible identity misuse'],
    ['SAME_PHONE', '같은 전화번호', 'Same phone', '전화번호가 같은데 신분증 번호가 달라요', 'same phone, but different ID numbers', '한 전화로 여러 신원을 제출하고 있어요', 'one phone is submitting several identities'],
    ['DUPLICATE', '중복 신청', 'Duplicate application', '신분증 번호가 같고 전화번호(와 이름)도 같아요', 'same ID number and the same phone (and name)', '같은 고객의 두 번째 신청 — 사기보다는 중복', 'the same customer filed twice — a duplicate rather than fraud'],
    ['SAME_NAME', '같은 이름·생년월일', 'Same name & date of birth', '이름과 생년월일이 같은데 신분증 번호와 전화번호가 모두 달라요', 'same name and date of birth, but different ID numbers and phones', '가장 약한 신호 — 참고용', 'the weakest signal — for reference'],
    ['DEALER', '접수 딜러', 'Filed by dealer', '신청과 그 신청을 접수한 딜러', 'an application and the dealer who filed it', '의심이 아니라 경로예요. 한 딜러에 여러 묶음이 모이면 딜러를 봐요', 'not a suspicion, a route; many rings through one dealer point at the dealer'],
  ];
  function renderFraudStandard() {
    const ko = LANG.lang !== 'en';
    const line = k => { const st = LINK_STYLE[k]; return `<span style="display:inline-block;width:22px;border-top:${st.width}px ${st.dash ? 'dashed' : 'solid'} ${st.color};vertical-align:middle;margin-right:6px"></span>`; };
    return `<div class="inner">
      <div class="head"><div><h2 id="standard-title">${t('사기 연결망 탐지 안내', 'How fraud network detection works')}</h2><span class="sub">${t('이 그림이 무엇을 보여 주고 어떻게 읽는지', 'What the picture shows and how to read it')}</span></div><button type="button" class="close" data-close="1" aria-label="${t('닫기', 'Close')}">✕</button></div>
      <h3>${t('무엇을 보여 주나', 'What it shows')}</h3>
      <p>${t('신청서끼리 같은 신분증 번호, 같은 전화번호, 같은 이름·생년월일이 겹치면 선으로 잇고, 이어진 신청을 하나의 "묶음"으로 모읍니다. 접수한 딜러도 사각형으로 함께 그려, 한 딜러를 통해 여러 신원이 들어오는 패턴까지 보이게 합니다.',
             'Applications that share an ID number, a phone number, or a name and date of birth are joined by a line, and everything joined together forms one "ring". The dealers who filed them are drawn as squares, so several identities arriving through one dealer also become visible.')}</p>
      <p>${t('리스크 규칙(Risk Flag)은 두 신청이 겹칠 때 나중에 들어온 신청에만 플래그를 올립니다. 이 그림은 먼저 들어온 신청까지 함께 묶어, 한 건씩 심사할 때는 보이지 않는 연결을 드러냅니다.',
             'The risk rules flag only the later application of an overlapping pair. This picture ties the earlier ones in as well, so a connection that stays hidden when cases are reviewed one at a time becomes visible.')}</p>
      <h3>${t('연결 규칙', 'How two applications get tied')}</h3>
      <div class="scroll"><table><thead><tr><th>${t('선', 'Line')}</th><th>${t('조건', 'Condition')}</th><th>${t('의미', 'What it means')}</th></tr></thead><tbody>
        ${FRAUD_ROWS.map(r => `<tr><td class="th">${line(r[0])}${esc(ko ? r[1] : r[2])}</td><td>${esc(ko ? r[3] : r[4])}</td><td class="sub" style="display:table-cell">${esc(ko ? r[5] : r[6])}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>${t('묶음 등급', 'Ring severity')}</h3>
      <ul>
        <li>${t('<b>높음</b>: 묶음 안에 "같은 신분증 번호" 또는 "같은 전화번호" 연결이 하나라도 있을 때. 서로 다른 사람이 신원 요소를 공유하는 상태입니다.', '<b>High</b>: the ring contains at least one "same ID number" or "same phone" tie, so different people are sharing identity details.')}</li>
        <li>${t('<b>중간</b>: 중복 신청과 이름·생년월일 일치만 있을 때.', '<b>Medium</b>: only duplicate applications and name-and-date-of-birth matches.')}</li>
        <li>${t('<b>단일 딜러</b>: 묶음의 모든 신청이 한 딜러를 통해 들어왔다는 표시입니다. 딜러 쪽을 먼저 확인하세요.', '<b>Single dealer</b>: every application in the ring came through one dealer. Check the dealer first.')}</li>
        <li>${t('원의 색은 AI 리스크 등급(A~D)이고, 큰 원과 붉은 테두리는 고위험(C·D)입니다.', 'A circle\'s colour is the AI risk grade (A to D); a larger circle with a red glow is high risk (C or D).')}</li>
      </ul>
      <h3>${t('사용 방법', 'How to use it')}</h3>
      <ul>
        <li>${t('원을 누르면 그 신청의 심사 화면이 열립니다. 오른쪽 묶음 목록의 신청번호도 같은 곳으로 갑니다.', 'Click a circle to open that application\'s review page. The application numbers in the ring list on the right go to the same place.')}</li>
        <li>${t('원이나 사각형을 끌어서 겹친 부분을 풀 수 있습니다. 옮긴 위치는 이 탭에서 유지되고, "배치 초기화"로 되돌립니다.', 'Drag a circle or square to untangle the picture. The new position is kept in this tab; "Reset layout" restores the default.')}</li>
        <li>${t('선이나 원 위에 마우스를 올리면 연결 사유와 마스킹된 번호가 보입니다.', 'Hover over a line or circle to see why it is tied and the masked number.')}</li>
        <li>${t('심사할 때는 묶음 전체를 같이 보세요. 한 건을 승인하기 전에 같은 묶음의 다른 신청이 어떻게 결정됐는지 확인합니다.', 'Review a ring as a whole. Before approving one application, check how the others in the same ring were decided.')}</li>
      </ul>
      <h3>${t('알아 둘 것', 'Good to know')}</h3>
      <ul>
        <li>${t('신분증 번호와 전화번호는 뒤 4자리만 표시됩니다. 전체 번호는 심사 화면에서 권한 있는 담당자만 봅니다.', 'ID and phone numbers show only their last four digits. The full numbers are visible only to authorised officers on the review page.')}</li>
        <li>${t('그림은 새로 고칠 때마다 전체 신청을 다시 대조합니다. 저장된 판단이 아니라 현재 데이터의 결과입니다.', 'The picture is recomputed from every application on each refresh. It is the current data, not a stored verdict.')}</li>
        <li>${t('묶음은 의심 신호이지 결론이 아닙니다. 가족이 전화번호를 공유하는 것처럼 정당한 사유도 있으니, 결정은 담당자가 합니다.', 'A ring is a signal, not a conclusion. There are legitimate cases, such as a family sharing one phone, so the officer decides.')}</li>
      </ul>
      <p class="sub" style="display:block;margin-top:12px">${t('대조 대상은 신분증에서 추출한 번호·이름·생년월일과 고객 전화번호입니다. 현재 데모 데이터에는 일부러 넣은 묶음이 포함되어 있습니다.', 'The comparison uses the number, name and date of birth extracted from the ID card and the customer phone. The current demo data includes rings planted on purpose.')}</p>
    </div>`;
  }
  function renderStandard(kind) {
    if (kind === 'fraud') return renderFraudStandard();
    const ko = LANG.lang !== 'en';
    return `<div class="inner">
      <div class="head"><div><h2 id="standard-title">${t('우수 딜러 기준', 'Excellent dealer standard')}</h2><span class="sub">${t('딜러 등급(일반 · 우수)을 정하고 유지하는 기준', 'How a dealer earns and keeps the excellent tier')}</span></div><button type="button" class="close" data-close="1" aria-label="${t('닫기', 'Close')}">✕</button></div>
      <h3>${t('우수 딜러란', 'What the tier means')}</h3>
      <p>${t('우수 딜러는 최근 실적에서 검증된 고객, 낮은 리스크, 높은 승인율을 꾸준히 보여 준 딜러입니다. 우수 딜러가 만든 신청의 고객은 리스크 평가에서 "우수 딜러 유입 고객" 배지를 받고, 심사 화면과 고객 리포트에 표시됩니다.',
             'An excellent dealer is one whose recent customers were consistently verified, low-risk and approved at a high rate. Customers filed by an excellent dealer receive the "referred by an excellent dealer" badge in the risk assessment, shown on the review page and the customer report.')}</p>
      <p>${t('배지는 참고 정보입니다. 리스크 점수나 등급을 바꾸지 않으므로, 우수 딜러의 고객이라도 위조 신호가 있으면 그대로 C·D 등급이 됩니다.',
             'The badge is informational. It does not change the risk score or grade, so an excellent dealer\'s customer with a forgery signal still lands in grade C or D.')}</p>
      <h3>${t('기준 (최근 6~12개월 실적 기준)', 'Criteria (judged on the last 6 to 12 months)')}</h3>
      <div class="scroll"><table><thead><tr><th>${t('항목', 'Criterion')}</th><th>${t('기준값', 'Threshold')}</th><th>${t('이유', 'Why')}</th></tr></thead><tbody>
        ${STANDARD_ROWS.map(r => `<tr><td class="th">${esc(ko ? r[0] : r[1])}</td><td>${esc(ko ? r[2] : r[3])}</td><td class="sub" style="display:table-cell">${esc(ko ? r[4] : r[5])}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>${t('적용 규칙', 'How it is applied')}</h3>
      <ul>
        <li>${t('모든 항목을 충족하면 우수 등급을 얻거나 유지합니다.', 'Meeting every criterion earns or keeps the excellent tier.')}</li>
        <li>${t('위조·사기 경고가 1건이라도 나오거나, 두 분기 연속 기준에 미달하면 일반 등급으로 내려갑니다.', 'A single fraud or forgery warning, or two consecutive quarters below threshold, drops the dealer to standard.')}</li>
        <li>${t('검토는 분기마다 하며, 이 탭의 승인율·고위험 비율·위조 경고·신원 일치율·30일 신청 수가 그 근거입니다.', 'The review runs quarterly, using the approval rate, high-risk share, fraud warnings, identity match rate and 30-day volume shown on this tab as evidence.')}</li>
        <li>${t('등급 변경은 심사 책임자가 확정하고 사유를 기록합니다. 기준값은 국가별로 조정할 수 있습니다.', 'A tier change is confirmed by the review lead with the reason recorded. Thresholds can be tuned per country.')}</li>
      </ul>
      <p class="sub" style="display:block;margin-top:12px">${t('현재 데모에서는 딜러 등급이 설정값(DEMO_DEALER_n_TIER)으로 지정되어 있고, 이 기준은 백오피스가 등급을 검토할 때 적용하는 정책입니다.', 'In the current demo the tier is set in configuration (DEMO_DEALER_n_TIER); this standard is the policy the back office applies when it reviews tiers.')}</p>
    </div>`;
  }
  const standardDlg = $('#standard');
  let standardKind = 'dealer';
  function openStandard(kind) { standardKind = kind; standardDlg.innerHTML = renderStandard(kind); if (!standardDlg.open) standardDlg.showModal(); }
  main.addEventListener('click', e => { const b = e.target.closest('[data-standard]'); if (b) openStandard(b.dataset.standard); });
  standardDlg.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === standardDlg) standardDlg.close(); });
  LANG.onChange(() => { if (standardDlg.open) standardDlg.innerHTML = renderStandard(standardKind); });

  function showTab(id) {
    id = tabAlias(id);
    if (!TABS.some(x => x[0] === id)) id = 'stats';
    activeTab = id;
    try { sessionStorage.setItem('dashboardTab', id); } catch {}
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    main.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    main.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== id; });
  }
  main.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
  main.addEventListener('keydown', e => {
    const b = e.target.closest('[data-tab]'); if (!b || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const i = TABS.findIndex(x => x[0] === b.dataset.tab); const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0];
    showTab(n); main.querySelector(`[data-tab="${n}"]`).focus(); e.preventDefault();
  });
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && tabAlias(id) !== activeTab) showTab(id); });

  async function load() {
    status.textContent = t('불러오는 중…', 'Loading…'); status.className = 'status';
    try {
      const [res, netRes] = await Promise.all([fetch('/admin/dashboard/stats'), fetch('/admin/fraud-network').catch(() => null)]);
      if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.error || ('HTTP ' + res.status)); }
      lastNetwork = netRes && netRes.ok ? await netRes.json().catch(() => null) : null;
      render(await res.json());
      status.textContent = t('업데이트 ', 'Updated ') + new Date().toLocaleTimeString(LANG.locale, { hour12: false });
      $('#auto').hidden = false;
    } catch (e) {
      status.textContent = t('오류: ', 'Error: ') + e.message; status.className = 'status err';
    }
  }
  $('#refresh').addEventListener('click', load);
  // Language switch: redraw the last payload; the static markup is swapped by lang.js itself.
  LANG.onChange(() => { if (lastData) render(lastData); if (copilotEl.innerHTML) paintCopilot(); });
  load();
  setInterval(() => { if (!document.hidden) load(); }, AUTO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
