<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS AI</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<style>
  :root { --bg: #1b3b48; --orange: #f2b059; --teal: #60a0a8; --grey: #2f5262; --text: #ffffff; --sub: #c8d6dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; overflow-x: hidden; }
  main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: 24px; padding: 48px 6vw; }
  .eyebrow { color: var(--orange); font-weight: 700; font-size: clamp(14px, 1.4vw, 18px); margin: 0 0 18px; letter-spacing: -0.01em; }
  .eyebrow .sep { margin: 0 10px; opacity: .9; }
  h1 { margin: 0; font-size: clamp(44px, 7vw, 92px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .lead { color: var(--sub); margin: 22px 0 0; font-size: clamp(14px, 1.3vw, 17px); line-height: 1.6; max-width: 32em; }
  .start { margin-top: 40px; display: inline-flex; align-items: center; gap: 12px; padding: 16px 40px; border: 0; border-radius: 999px; background: var(--orange); color: #1b2a30; font: inherit; font-size: 18px; font-weight: 800; letter-spacing: .12em; cursor: pointer; text-decoration: none; box-shadow: 0 10px 30px rgba(242,176,89,.25); transition: transform .15s, box-shadow .15s; }
  .start:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(242,176,89,.4); }
  .start:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .map svg { width: 100%; height: auto; display: block; }
  .map circle { r: 2.6px; }
  .map .o { fill: var(--orange); } .map .t { fill: var(--teal); } .map .g { fill: var(--grey); }
  .legend { display: flex; justify-content: flex-end; gap: 18px; font-size: 13px; color: var(--sub); margin-top: 10px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  footer { position: fixed; left: 6vw; bottom: 20px; font-size: 12px; color: #8fa6af; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 40px 16px 64px; } footer { left: 16px; } .legend { justify-content: flex-start; flex-wrap: wrap; } }
  @media (prefers-reduced-motion: reduce) { .start { transition: none; } }
</style>
</head>

<main>
  <section>
    <h1>NEXUS AI</h1>
    <p class="lead">해외 손자회사(인도네시아·미얀마·캄보디아)의 대출 서류 접수는 AI Agent가, 승인 판단은 사람이 NEXUS AI와 함께 합니다.</p>
